em</text><rect x="940" y="130" width="500" height="500" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="2"/><rect x="952" y="150" width="476" height="30" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="966" y="170" font-size="12" fill="#111827" font-weight="bold" text-anchor="start">Claude Opus 4.6</text><text x="1120" y="170" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Opus</text><text x="1190" y="170" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">92.4</text><text x="1260" y="170" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">$5.00</text><text x="1340" y="170" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">$25.00</text><text x="966" y="202" font-size="12" fill="#0072B2" font-weight="normal" text-anchor="start">▾ All figures</text><text x="956" y="232" font-size="11" fill="#6B7280" font-weight="bold" text-anchor="start" letter-spacing="1.1">MODEL DETAILS</text><line x1="956" y1="239" x2="1424" y2="239" stroke="#D1D5DB" stroke-width="1"/><text x="956" y="254" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Vendor</text><text x="1106" y="254" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Anthropic</text><text x="956" y="280" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Harnesses</text><text x="1106" y="280" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Claude Code, Codex CLI</text><text x="956" y="314" font-size="11" fill="#6B7280" font-weight="bold" text-anchor="start" letter-spacing="1.1">BENCHMARK SCORES</text><line x1="956" y1="321" x2="1424" y2="321" stroke="#D1D5DB" stroke-width="1"/><text x="956" y="336" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">SWE-bench Verified</text><text x="1106" y="336" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">80.9%</text><circle cx="1161" cy="332" r="3" fill="#009E73"/><text x="1169" y="336" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">verified (Source)</text><line x1="1169" y1="339" x2="1272.2" y2="339" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 2"/><text x="956" y="362" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">GPQA Diamond</text><text x="1106" y="362" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">88.1%</text><circle cx="1161" cy="358" r="3" fill="#E69F00"/><text x="1169" y="362" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">self-reported (Source)</text><line x1="1169" y1="365" x2="1304.2" y2="365" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 2"/><text x="956" y="388" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Coverage</text><text x="1106" y="388" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">50%</text><text x="1144.6" y="388" font-size="12" fill="#D55E00" font-weight="normal" text-anchor="start">low coverage</text><rect x="952" y="411" width="476" height="24" rx="4" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="956" y="427" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">SWE-bench Pro, Terminal-Bench 2.1 — Not reported</text><text x="956" y="612" font-size="11" fill="#009E73" font-weight="normal" text-anchor="start">identical grouping and rail; only the rail width changes at md+</text><text x="60" y="690" font-size="13" fill="#111827" font-weight="bold" text-anchor="start">Why</text><text x="60" y="712" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Treatment 1 — the value out-ranks its label on size (12→14), weight (400→600) and colour (muted→ink) at once.</text><text x="60" y="731" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Treatment 2 — &lt;dt&gt; in a fixed rail, &lt;dd&gt; beside it, both left-aligned; FigureCell layout=&quot;inline&quot; puts the badge on the value's baseline.</text><text x="60" y="750" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Treatment 3 — two &lt;section&gt; + &lt;h4&gt; groups (Model details / Benchmark scores); coverage sits with the figures it is derived from.</text><text x="60" y="769" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Treatment 4 — unpublished figures leave the flow and share one &lt;dd&gt;: many &lt;dt&gt;, one “Not reported”. Every label is still a &lt;dt&gt;, so W-26/W-30 parity is untouched.</text><text x="60" y="788" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">DWT-002 preserved — the evidence dot still resolves through --evidence-*; DD-34 moves the badge in flow, never its colour. UWT-004's visible “(Source)” is carried, not dropped.</text></svg>