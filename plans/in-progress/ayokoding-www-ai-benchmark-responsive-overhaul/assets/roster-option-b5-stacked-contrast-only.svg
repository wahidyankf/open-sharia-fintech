nt-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">SWE-bench Pro</text><text x="516" y="388" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Not reported</text><text x="516" y="408" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Terminal-Bench 2.1</text><text x="516" y="426" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Not reported</text><text x="516" y="446" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">GPQA Diamond</text><text x="516" y="464" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">88.1%</text><circle cx="571" cy="460" r="3" fill="#E69F00"/><text x="579" y="464" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">self-reported (Source)</text><line x1="579" y1="467" x2="714.2" y2="467" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 2"/><text x="516" y="484" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Coverage</text><text x="516" y="502" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">50%</text><text x="554.6" y="502" font-size="12" fill="#D55E00" font-weight="normal" text-anchor="start">low coverage</text><text x="516" y="612" font-size="11" fill="#D55E00" font-weight="normal" text-anchor="start">contrast fixed and badge inlined — but still a flat 7-field run</text><text x="940" y="104" font-size="17" fill="#111827" font-weight="bold" text-anchor="start">After — desktop (lg)</text><text x="940" y="122" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">table per-row detail region · same flat stack, wider</text><rect x="940" y="130" width="500" height="500" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="2"/><rect x="952" y="150" width="476" height="30" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="966" y="170" font-size="12" fill="#111827" font-weight="bold" text-anchor="start">Claude Opus 4.6</text><text x="1120" y="170" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Opus</text><text x="1190" y="170" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">92.4</text><text x="1260" y="170" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">$5.00</text><text x="1340" y="170" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">$25.00</text><text x="966" y="202" font-size="12" fill="#0072B2" font-weight="normal" text-anchor="start">▾ All figures</text><text x="956" y="232" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Vendor</text><text x="956" y="250" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Anthropic</text><text x="956" y="270" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Harnesses</text><text x="956" y="288" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Claude Code, Codex CLI</text><text x="956" y="308" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">SWE-bench Verified</text><text x="956" y="326" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">80.9%</text><circle cx="1011" cy="322" r="3" fill="#009E73"/><text x="1019" y="326" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">verified (Source)</text><line x1="1019" y1="329" x2="1122.2" y2="329" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 2"/><text x="956" y="346" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">SWE-bench Pro</text><text x="956" y="364" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Not reported</text><text x="956" y="384" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Terminal-Bench 2.1</text><text x="956" y="402" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Not reported</text><text x="956" y="422" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">GPQA Diamond</text><text x="956" y="440" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">88.1%</text><circle cx="1011" cy="436" r="3" fill="#E69F00"/><text x="1019" y="440" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">self-reported (Source)</text><line x1="1019" y1="443" x2="1154.2" y2="443" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 2"/><text x="956" y="460" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Coverage</text><text x="956" y="478" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">50%</text><text x="994.6" y="478" font-size="12" fill="#D55E00" font-weight="normal" text-anchor="start">low coverage</text><text x="956" y="612" font-size="11" fill="#D55E00" font-weight="normal" text-anchor="start">no grouping at any width; absent figures keep a full slot each</text><text x="60" y="690" font-size="13" fill="#111827" font-weight="bold" text-anchor="start">Why</text><text x="60" y="712" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">B5 is exactly Treatments 1 and 2 of Option B4, and nothing else.</text><text x="60" y="731" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">It fixes DN-1 (inverted label/value rank) and DN-2 (three lines per field) — the same two fixes B4 applies.</text><text x="60" y="750" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">It leaves DN-3 untouched: seven equal-weight fields in one flat run, with nothing for the eye to chunk on.</text><text x="60" y="769" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">It leaves DN-4 untouched: each unpublished figure still consumes a full field slot at the weight of a real one.</text><text x="60" y="788" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Kept as the hi-fi runner-up because it is the smallest diff and a strict subset of B4 — so B4 can be reduced to it if the grouping ever proves unwanted.</text></svg>