  <!-- Band colours are always paired with a text label — never colour alone. -->

  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF" />
  <rect x="4" y="4" width="1232" height="892" fill="none" stroke="#000000" stroke-width="2" />

