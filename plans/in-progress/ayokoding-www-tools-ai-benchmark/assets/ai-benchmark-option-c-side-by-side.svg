  <text x="260" y="205" font-size="13" font-weight="bold" fill="#000000">Capability index (0&#8211;100)</text>
  <text x="700" y="205" font-size="13" font-weight="bold" fill="#000000">Price USD / 1M tokens &#8212; in &#9475; out</text>

