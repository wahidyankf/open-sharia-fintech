  <rect x="760" y="477" width="35" height="18" fill="#e8e0c7" stroke="#000000" stroke-width="1" opacity="0.55" />
  <text x="800" y="490" font-size="12" fill="#000000">$5.00</text>

  <!-- band rule: UNRATED -->
  <rect x="20" y="518" width="1200" height="4" fill="#cfcecb" />
  <text x="28" y="540" font-size="13" font-weight="bold" fill="#cfcecb">UNRATED &#8212; no published score</text>
  <text x="36" y="562" font-size="12" fill="#000000">MiMo v2.5 Pro &#183; grok-build-0.1 &#183; Gemini 3.5 Flash Lite &#8212; text list, no row bars</text>

  <!-- axis -->
  <line x1="260" y1="590" x2="590" y2="590" stroke="#000000" stroke-width="1" />
  <text x="260" y="608" font-size="11" fill="#000000">0</text>
  <text x="420" y="608" font-size="11" fill="#000000">50</text>
  <text x="580" y="608" font-size="11" fill="#000000">100 (index)</text>

  <!-- Note on responsive collapse -->
  <rect x="20" y="636" width="1200" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="6,4" />
  <text x="36" y="662" font-size="14" font-weight="bold" fill="#000000">Why this loses to Option A</text>
  <text x="36" y="686" font-size="12" fill="#000000">This side-by-side row alignment survives only at desktop (&#8805; 1024px). Below 768px the</text>
  <text x="36" y="706" font-size="12" fill="#000000">capability-index column and the price column cannot share a row — they must stack —</text>
  <text x="36" y="726" font-size="12" fill="#000000">which degenerates into Option A's stacked-panel layout, but after paying for a second</text>
  <text x="36" y="746" font-size="12" fill="#000000">layout path to build, test, and maintain. Option A recovers the same ordering guarantee</text>
  <text x="36" y="764" font-size="11" fill="#666666">(AC-11) natively, at every breakpoint, for a smaller implementation surface.</text>

  <text x="28" y="806" font-size="11" fill="#666666">Mockup only &#8212; sample of 8 of 39 models. Real page renders the full roster from &lt;DATA&gt;models.ts.</text>
  <text x="28" y="826" font-size="11" fill="#666666">Runner-up finalist: Option C &#8212; Aligned Side-by-Side Comparison Grid. See prd.md &#167;Narrow / &#167;Justify.</text>

  <!-- Mobile collapse indicator -->
  <rect x="20" y="840" width="1200" height="40" fill="#FFF6E5" stroke="#e8e0c7" stroke-width="1" />
  <text x="36" y="864" font-size="12" fill="#000000">MOBILE (&lt; 768px): the two columns cannot survive &#8212; they stack into Option A's layout.</text>
</svg>
