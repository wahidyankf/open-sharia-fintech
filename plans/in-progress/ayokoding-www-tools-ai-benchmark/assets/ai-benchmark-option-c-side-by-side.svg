  <rect x="260" y="253" width="330" height="18" fill="#cccbdd" stroke="#000000" stroke-width="1" />
  <text x="598" y="266" font-size="12" fill="#000000">99.9</text>
  <rect x="700" y="253" width="35" height="18" fill="#cccbdd" stroke="#000000" stroke-width="1" />
  <text x="740" y="266" font-size="12" fill="#000000">$5.00</text>
  <rect x="800" y="253" width="210" height="18" fill="#cccbdd" stroke="#000000" stroke-width="1" opacity="0.55" />
  <text x="1015" y="266" font-size="12" fill="#000000">$30.00</text>

  <!-- row: Claude Opus 5 -->
  <line x1="20" y1="316" x2="1220" y2="316" stroke="#CCCCCC" stroke-width="1" />
  <text x="36" y="304" font-size="13" fill="#000000">Claude Opus 5</text>
  <rect x="260" y="291" width="327" height="18" fill="#cccbdd" stroke="#000000" stroke-width="1" />
  <text x="595" y="304" font-size="12" fill="#000000">99.4</text>
  <rect x="700" y="291" width="35" height="18" fill="#cccbdd" stroke="#000000" stroke-width="1" />
  <text x="740" y="304" font-size="12" fill="#000000">$5.00</text>
  <rect x="800" y="291" width="175" height="18" fill="#cccbdd" stroke="#000000" stroke-width="1" opacity="0.55" />
  <text x="980" y="304" font-size="12" fill="#000000">$25.00</text>

