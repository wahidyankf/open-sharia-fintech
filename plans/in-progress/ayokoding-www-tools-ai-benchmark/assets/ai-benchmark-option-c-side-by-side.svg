  <rect x="260" y="477" width="227" height="18" fill="#e8e0c7" stroke="#000000" stroke-width="1" />
  <text x="492" y="490" font-size="12" fill="#000000">68.7</text>
  <rect x="700" y="477" width="7" height="18" fill="#e8e0c7" stroke="#000000" stroke-width="1" />
