  <text x="1032" y="24" font-size="13" fill="#000000">EN | ID</text>
  <text x="1130" y="24" font-size="13" fill="#000000">&#9728; / &#9789;</text>
  <text x="28" y="48" font-size="13" fill="#000000">apps/ayokoding-www &#8226; /tools/ai-benchmark</text>

