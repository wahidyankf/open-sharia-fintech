  <rect x="20" y="332" width="1200" height="4" fill="#ced6dc" />
  <text x="28" y="354" font-size="13" font-weight="bold" fill="#ced6dc">SONNET &#8212; 85.7 &#8804; index &lt; 99.4</text>

  <!-- row: Claude Fable 5 -->
  <line x1="20" y1="390" x2="1220" y2="390" stroke="#CCCCCC" stroke-width="1" />
  <text x="36" y="378" font-size="13" fill="#000000">Claude Fable 5</text>
  <rect x="260" y="365" width="325" height="18" fill="#ced6dc" stroke="#000000" stroke-width="1" />
  <text x="593" y="378" font-size="12" fill="#000000">98.2</text>
  <rect x="700" y="365" width="70" height="18" fill="#ced6dc" stroke="#000000" stroke-width="1" />
  <text x="775" y="378" font-size="12" fill="#000000">$10.00</text>
  <rect x="830" y="365" width="350" height="18" fill="#ced6dc" stroke="#000000" stroke-width="1" opacity="0.55" />
  <text x="1185" y="378" font-size="12" fill="#000000">$50</text>

  <!-- row: Claude Sonnet 5 -->
  <line x1="20" y1="428" x2="1220" y2="428" stroke="#CCCCCC" stroke-width="1" />
  <text x="36" y="416" font-size="13" fill="#000000">Claude Sonnet 5 &#8592;anchor</text>
  <rect x="260" y="403" width="283" height="18" fill="#ced6dc" stroke="#000000" stroke-width="1" />
  <text x="548" y="416" font-size="12" fill="#000000">85.7</text>
  <rect x="700" y="403" width="21" height="18" fill="#ced6dc" stroke="#000000" stroke-width="1" />
