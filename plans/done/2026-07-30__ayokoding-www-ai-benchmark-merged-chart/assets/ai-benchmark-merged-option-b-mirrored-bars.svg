<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="420" fill="#FFFFFF" stroke="#D0D0D0"/>

  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1A1A1A">AI Model Benchmark</text>
  <text x="20" y="46" font-size="11" fill="#6B6B6B">Runner-up mockup — twin-track mirrored bars (rejected)</text>

  <!-- Center spine -->
  <line x1="460" y1="60" x2="460" y2="380" stroke="#999999" stroke-dasharray="3,3"/>
  <text x="460" y="52" font-size="9" text-anchor="middle" fill="#999999">0 (shared spine)</text>
  <text x="230" y="72" font-size="10" text-anchor="middle" fill="#6B6B6B">← price (USD/1M)</text>
  <text x="690" y="72" font-size="10" text-anchor="middle" fill="#6B6B6B">capability index →</text>

  <!-- OPUS band -->
  <text x="20" y="96" font-size="12" font-weight="bold" fill="#7A4A72">OPUS</text>
  <text x="20" y="112" font-size="10" fill="#1A1A1A">Claude Opus 5</text>
  <rect x="460" y="103" width="330" height="14" fill="#CC78BC"/>
  <text x="800" y="113" font-size="9" fill="#333333">94</text>
  <rect x="360" y="103" width="100" height="14" fill="#CC78BC" opacity="0.55"/>
  <text x="345" y="113" font-size="9" text-anchor="end" fill="#333333">$25/$5</text>

  <text x="20" y="138" font-size="10" fill="#1A1A1A">GPT-5.6 Sol</text>
  <rect x="460" y="129" width="345" height="14" fill="#CC78BC"/>
  <text x="815" y="139" font-size="9" fill="#333333">99.9</text>
  <rect x="335" y="129" width="125" height="14" fill="#CC78BC" opacity="0.55"/>
  <text x="320" y="139" font-size="9" text-anchor="end" fill="#333333">$30/$5</text>

  <!-- SONNET band -->
  <text x="20" y="172" font-size="12" font-weight="bold" fill="#02664A">SONNET</text>
  <text x="20" y="188" font-size="10" fill="#1A1A1A">Claude Sonnet 5</text>
  <rect x="460" y="179" width="278" height="14" fill="#029E73"/>
  <text x="748" y="189" font-size="9" fill="#333333">85.7</text>
  <rect x="400" y="179" width="60" height="14" fill="#029E73" opacity="0.55"/>
  <text x="385" y="189" font-size="9" text-anchor="end" fill="#333333">$15/$3</text>

  <!-- Confusion callouts -->
  <rect x="20" y="230" width="880" height="150" fill="#FFF4E5" stroke="#DE8F05"/>
  <text x="35" y="252" font-size="11" font-weight="bold" fill="#8A5900">Why this lost (drop reasons — see prd.md § Narrow)</text>
  <text x="35" y="272" font-size="10" fill="#333333">1. Two different units (an index 0-100 and a USD rate) share one visual "length" cue pointing</text>
  <text x="45" y="288" font-size="10" fill="#333333">   opposite directions — a reader must learn a new mirrored-axis convention with no precedent</text>
  <text x="45" y="304" font-size="10" fill="#333333">   anywhere else on this page or in `chart-primitives.tsx`.</text>
  <text x="35" y="326" font-size="10" fill="#333333">2. The combined input+output price collapses into one bar segment per model (labelled as text</text>
  <text x="45" y="342" font-size="10" fill="#333333">   "out/in" pair) rather than two independently-scaled bars — this loses the bar-length-encodes-</text>
  <text x="45" y="358" font-size="10" fill="#333333">   value property Q1 already fixed for input and output individually.</text>
</svg>
