  <text x="20" y="46" font-size="11" fill="#6B6B6B">Data as of 2026-07-28 · 39 models · 5 harnesses</text>

  <!-- Filter bar (unchanged, existing component) -->
  <rect x="20" y="58" width="880" height="30" fill="#F5F5F5" stroke="#D0D0D0"/>
