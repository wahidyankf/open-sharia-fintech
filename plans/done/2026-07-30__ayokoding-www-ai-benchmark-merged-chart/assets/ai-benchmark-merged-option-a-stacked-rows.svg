  <rect x="150" y="539" width="70" height="9" rx="2" fill="#DE8F05" opacity="0.55"/>
  <text x="228" y="547" font-size="9" fill="#333333">out $5.00</text>

  <!-- UNRATED text list (no bars — carried over from today's capability-chart unrated group) -->
  <rect x="20" y="575" width="880" height="6" fill="#808080"/>
  <text x="20" y="595" font-size="12" font-weight="bold" fill="#4D4D4D">UNRATED — no published composite score (no bars; text list only)</text>
  <text x="30" y="612" font-size="10" fill="#5A5A5A">MiMo v2.5 Pro  ·  grok-build-0.1  ·  Gemini 3.5 Flash Lite</text>

  <!-- SUBSCRIPTION-ONLY text list (unchanged treatment for capability-bar-less models) -->
  <text x="20" y="638" font-size="12" font-weight="bold" fill="#4D4D4D">SUBSCRIPTION-ONLY, UNRATED — no per-token rate, no composite score</text>
  <text x="30" y="655" font-size="10" fill="#5A5A5A">Qwen3.7 Plus — Subscription ($10.00/month, OpenCode Go)</text>

  <!-- Footer note -->
  <text x="20" y="682" font-size="9" fill="#8A8A8A">A RATED model billed only by subscription shows &quot;Subscription ($cost)&quot; text in place of its two price bars — its capability bar still renders normally in its band (DD-1).</text>
</svg>
