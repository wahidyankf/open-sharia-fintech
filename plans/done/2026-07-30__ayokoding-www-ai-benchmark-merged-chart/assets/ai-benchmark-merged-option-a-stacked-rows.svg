  <text x="705" y="434" font-size="9" fill="#333333">$50.00 (highest — sorted last)</text>

  <!-- LIGHT band section (collapsed summary — same shape as above, condensed for the mockup) -->
  <rect x="20" y="458" width="880" height="8" fill="#DE8F05"/>
  <text x="20" y="480" font-size="13" font-weight="bold" fill="#8A5900">LIGHT — index &lt; 85.7</text>
  <rect x="740" y="466" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="750" y="481" font-size="10" fill="#333333">Sort: Capability ▾</text>
  <text x="30" y="505" font-size="11" font-weight="600" fill="#1A1A1A">Claude Haiku 4.5 — 68.7</text>
  <text x="30" y="520" font-size="9" fill="#6B6B6B">Capability</text>
