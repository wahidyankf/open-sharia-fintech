version: 2
app: ose
contexts:
  - name: health
    summary: >-
      Liveness endpoint — advertises service health to orchestrators and
      monitoring systems. Stateless, no DB dependency.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/ose-be/src/OseBe/Contexts/Health
    code_lang:
      - fs
    glossary: specs/apps/ose/ddd/ubiquitous-language/health.md
    gherkin: specs/apps/ose/behavior/be/gherkin/health

  - name: regulatory-source
    summary: >-
      Ingests and stores regulator-published rule documents (PDFs, circulars)
      with provenance metadata. Acts as the authoritative source for all
      regulatory text consumed by gap-analysis.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/ose-be/src/OseBe/Contexts/RegulatorySource
    code_lang:
      - fs
    glossary: specs/apps/ose/ddd/ubiquitous-language/regulatory-source.md
    gherkin: specs/apps/ose/behavior/be/gherkin/regulatory-source
    relationships:
      - to: gap-analysis
        kind: customer-supplier
        role: supplier

  - name: internal-policy
    summary: >-
      Ingests and stores company-internal documents (SOPs, manuals, procedures)
      with version and scope metadata. Acts as the authoritative source for all
      internal policy text consumed by gap-analysis.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/ose-be/src/OseBe/Contexts/InternalPolicy
    code_lang:
      - fs
    glossary: specs/apps/ose/ddd/ubiquitous-language/internal-policy.md
    gherkin: specs/apps/ose/behavior/be/gherkin/internal-policy
    relationships:
      - to: gap-analysis
        kind: customer-supplier
        role: supplier

  - name: gap-analysis
    summary: >-
      Compares a regulatory-source corpus against an internal-policy corpus and
      emits structured GapItem records. Orchestrates calls to ai-orchestration
      for LLM-assisted comparison. Owns the gap report lifecycle.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/ose-be/src/OseBe/Contexts/GapAnalysis
    code_lang:
      - fs
    glossary: specs/apps/ose/ddd/ubiquitous-language/gap-analysis.md
    gherkin: specs/apps/ose/behavior/be/gherkin/gap-analysis
    relationships:
      - to: regulatory-source
        kind: customer-supplier
        role: customer
      - to: internal-policy
        kind: customer-supplier
        role: customer
      - to: ai-orchestration
        kind: customer-supplier
        role: customer

  - name: ai-orchestration
    summary: >-
      Wraps LLM calls (OpenRouter), prompt management, retry/backoff, and
      token-budget accounting. Stateless from the BE side — does not persist
      LLM outputs.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/ose-be/src/OseBe/Contexts/AiOrchestration
    code_lang:
      - fs
    glossary: specs/apps/ose/ddd/ubiquitous-language/ai-orchestration.md
    gherkin: specs/apps/ose/behavior/be/gherkin/ai-orchestration
    relationships:
      - to: gap-analysis
        kind: customer-supplier
        role: supplier

  - name: db
    summary: >-
      Database schema lifecycle — applies pending DbUp embedded migrations on
      boot before the HTTP server starts. Ensures the schema is always
      up-to-date without manual intervention. Cross-cutting infrastructure
      concern.
    layers:
      - Infrastructure
    code:
      - apps/ose-be/src/OseBe/Contexts/Db
    code_lang:
      - fs
    glossary: specs/apps/ose/ddd/ubiquitous-language/db.md
    gherkin: specs/apps/ose/behavior/be/gherkin/db

  - name: messaging
    summary: >-
      NATS client and JetStream durable stream demo. Connects to NATS at startup
      (fail-fast on missing URL), publishes and acks on ose-app.messaging.demo.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/ose-be/src/OseBe/Contexts/Messaging
    code_lang:
      - fs
    glossary: specs/apps/ose/ddd/ubiquitous-language/messaging.md
    gherkin: specs/apps/ose/behavior/be/gherkin/messaging

  - name: config
    summary: >-
      Loads exactly one .env.<APP_ENV> tier file at startup, before any other
      configuration is read. Process environment variables always win over file
      values, and a missing file is not an error — the normal case in CI, where
      real env vars are already set. Cross-cutting infrastructure concern.
    layers:
      - Infrastructure
    code:
      - apps/ose-be/src/OseBe/Contexts/Config
    code_lang:
      - fs
    glossary: specs/apps/ose/ddd/ubiquitous-language/config.md
    gherkin: specs/apps/ose/behavior/be/gherkin/config
