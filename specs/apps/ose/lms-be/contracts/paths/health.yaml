/api/v1/health:
  get:
    operationId: getHealth
    summary: Health check
    tags:
      - Health
    responses:
      "200":
        description: Service is healthy
        content:
          application/json:
            schema:
              $ref: "../schemas/health.yaml#/HealthResponse"
      "405":
        description: The endpoint exists but does not support the requested method
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
