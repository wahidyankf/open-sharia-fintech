/api/v1/hello:
  get:
    operationId: getHello
    summary: Greeting
    tags:
      - Hello
    responses:
      "200":
        description: The greeting was returned
        content:
          application/json:
            schema:
              $ref: "../schemas/hello.yaml#/HelloResponse"
      "405":
        description: The endpoint exists but does not support the requested method
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
