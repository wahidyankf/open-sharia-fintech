ErrorResponse:
  type: object
  description: >-
    Spring Boot's default error envelope, returned by the application's own error
    controller for an unmapped path or an unsupported method. Documented because
    clients observe it, not because the service constructs it by hand.
  required:
    - timestamp
    - status
    - error
    - path
  properties:
    timestamp:
      type: string
      format: date-time
      example: "2026-09-08T17:00:03.025Z"
    status:
      type: integer
      example: 405
    error:
      type: string
      example: Method Not Allowed
    path:
      type: string
      example: /api/v1/health
