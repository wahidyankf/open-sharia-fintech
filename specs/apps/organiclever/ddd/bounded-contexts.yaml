version: 2
app: organiclever
contexts:
  - name: journal
    summary: >-
      Append-only event log (PGlite-backed) that is the system of record for
      everything the user did — workout, reading, learning, meal, focus —
      modelled as typed payloads on JournalEvent rows.
    layers:
      - domain
      - application
      - infrastructure
      - presentation
    code:
      - apps/organiclever-app-web/src/contexts/journal
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/journal.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/journal
    relationships:
      - to: workout-session
        kind: customer-supplier
        role: supplier
      - to: stats
        kind: customer-supplier
        role: supplier

  - name: workout-session
    summary: >-
      In-progress workout state machine: lifts a Routine template into an active
      WorkoutSession, tracks set-by-set progress, and persists the outcome
      through the journal context as a WorkoutPayload JournalEvent.
    layers:
      - domain
      - application
      - infrastructure
      - presentation
    code:
      - apps/organiclever-app-web/src/contexts/workout-session
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/workout-session.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/workout-session
    relationships:
      - to: journal
        kind: customer-supplier
        role: customer
      - to: routine
        kind: conformist
        role: downstream

  - name: routine
    summary: >-
      Reusable workout templates the user authors and runs — each Routine
      carries an ordered list of RoutineExercise entries with default sets,
      reps, and weights.
    layers:
      - domain
      - application
      - infrastructure
      - presentation
    code:
      - apps/organiclever-app-web/src/contexts/routine
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/routine.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/routine
    relationships:
      - to: workout-session
        kind: conformist
        role: upstream

  - name: stats
    summary: >-
      Read-only projections over JournalEvents — daily/weekly/monthly
      aggregates, streaks, and progress charts. No persistence of its own;
      pure derivations from the journal context.
    layers:
      - domain
      - application
      - infrastructure
      - presentation
    code:
      - apps/organiclever-app-web/src/contexts/stats
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/stats.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/stats
    relationships:
      - to: journal
        kind: customer-supplier
        role: customer

  - name: settings
    summary: >-
      User-local preferences (theme, locale, units) persisted in PGlite. Owns
      invariants like "exactly one preferences row per user" and the dark-mode
      toggle.
    layers:
      - domain
      - application
      - infrastructure
      - presentation
    code:
      - apps/organiclever-app-web/src/contexts/settings
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/settings.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/settings
    relationships: []

  - name: app-shell
    summary: >-
      Cross-cutting UI shell — i18n keys, design tokens, layout chrome,
      navigation skeleton, error boundaries, app loggers, and the UI shell
      xstate machine. Shared kernel; owns no domain entities.
    layers:
      - domain
      - application
      - infrastructure
      - presentation
    code:
      - apps/organiclever-app-web/src/contexts/app-shell
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/app-shell.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/app-shell
    relationships: []

  - name: health
    summary: >-
      Backend health-endpoint client and the /system/status/be diagnostic page.
      Reads ORGANICLEVER_BE_URL, probes GET /health, and renders an
      UP / DOWN / Not configured tile.
    layers:
      - domain
      - application
      - infrastructure
      - presentation
    code:
      - apps/organiclever-app-web/src/contexts/health
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/health.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/health
    relationships: []

  - name: routing
    summary: >-
      Disabled-route guards. No authentication ships today, so /login and /profile
      exist only as 404 stubs to communicate "feature not yet available"
      without leaking placeholders into other contexts.
    layers:
      - domain
      - application
      - infrastructure
      - presentation
    code:
      - apps/organiclever-app-web/src/contexts/routing
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/routing.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/routing
    relationships: []

  - name: env-loader
    summary: >-
      Tiered .env.<APP_ENV> loader for organiclever-app-web, wired as the
      first import in next.config.ts. Loads exactly one .env.<tier> file at
      startup; process env values always win over file values, a missing
      file is not an error, and a stray auto-loaded .env/.env.production
      beside the tier file fails loudly at any non-local tier.
    layers:
      - infrastructure
    code:
      - apps/organiclever-app-web/src/contexts/env-loader
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/env-loader.md
    gherkin: specs/apps/organiclever/behavior/organiclever-app-web/gherkin/env-loader
    relationships: []

  - name: be-env
    summary: >-
      Tiered .env.<APP_ENV> loader shared by every app in this repo. Loads
      exactly one .env.<tier> file at startup; process env values always win
      over file values, and a missing file is not an error.
    layers:
      - Infrastructure
    code:
      - apps/organiclever-be/src/OrganicleverBe/Contexts/Env
    code_lang:
      - fs
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/be-env.md
    gherkin: specs/apps/organiclever/behavior/organiclever-be/gherkin/env

  - name: be-db
    summary: >-
      Database schema lifecycle — applies pending DbUp embedded migrations on
      boot before the HTTP server starts. Ensures the schema is always
      up-to-date without manual intervention. Cross-cutting infrastructure
      concern.
    layers:
      - Infrastructure
    code:
      - apps/organiclever-be/src/OrganicleverBe/Contexts/Db
    code_lang:
      - fs
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/be-db.md
    gherkin: specs/apps/organiclever/behavior/organiclever-be/gherkin/db

  - name: be-health
    summary: >-
      Liveness endpoint — advertises service health to orchestrators and
      monitoring systems. Stateless, no DB dependency.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/organiclever-be/src/OrganicleverBe/Contexts/Health
    code_lang:
      - fs
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/be-health.md
    gherkin: specs/apps/organiclever/behavior/organiclever-be/gherkin/health

  - name: be-journal
    summary: >-
      Server-side journal CRUD — the F# / EF Core mirror of the PGlite client
      journal context. Persists typed-payload JournalEntry rows to PostgreSQL and
      exposes full create/read/update/delete over /api/v1/journal/entries. Ships
      unconsumed; the web client remains PGlite-backed.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/organiclever-be/src/OrganicleverBe/Contexts/Journal
    code_lang:
      - fs
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/be-journal.md
    gherkin: specs/apps/organiclever/behavior/organiclever-be/gherkin/journal

  - name: messaging
    summary: >-
      NATS client and JetStream durable stream demo. Connects to NATS at startup
      (best-effort), publishes and acks on organiclever.messaging.demo.
    layers:
      - Domain
      - Application
      - Infrastructure
      - Api
    code:
      - apps/organiclever-be/src/OrganicleverBe/Contexts/Messaging
    code_lang:
      - fs
    glossary: specs/apps/organiclever/ddd/ubiquitous-language/messaging.md
    gherkin: specs/apps/organiclever/behavior/organiclever-be/gherkin/messaging
