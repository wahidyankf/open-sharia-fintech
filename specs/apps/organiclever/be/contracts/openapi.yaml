openapi: 3.1.0
info:
  title: OrganicLever API
  description: REST API contract for the OrganicLever productivity platform
  version: 1.0.0
  contact:
    name: Open Sharia Enterprise
    url: https://github.com/wahidyankf/ose-public

servers:
  - url: http://localhost:8202
    description: Local development

tags:
  - name: Health
    description: Service health checks
  - name: Journal
    description: Journal entry CRUD (server-of-record mirror; ships unconsumed)

components:
  schemas:
    # Common
    ErrorResponse:
      $ref: "./schemas/error.yaml#/ErrorResponse"
    HealthResponse:
      $ref: "./schemas/health.yaml#/HealthResponse"
    # Journal
    JournalEntry:
      $ref: "./schemas/journal.yaml#/JournalEntry"
    NewJournalEntry:
      $ref: "./schemas/journal.yaml#/NewJournalEntry"
    UpdateJournalEntry:
      $ref: "./schemas/journal.yaml#/UpdateJournalEntry"

paths:
  # Health
  /api/v1/health:
    $ref: "./paths/health.yaml#/~1api~1v1~1health"
  # Journal
  /api/v1/journal/entries:
    $ref: "./paths/journal.yaml#/~1api~1v1~1journal~1entries"
  /api/v1/journal/entries/{id}:
    $ref: "./paths/journal.yaml#/~1api~1v1~1journal~1entries~1{id}"
