services:
  organiclever-be:
    build:
      context: .
      dockerfile: Dockerfile.be.dev
    ports:
      - "8202:8202"
    volumes:
      - ../../../apps/organiclever-be:/workspace:rw
      - ../../../specs/apps/organiclever/be/behaviors:/specs/apps/organiclever/be/behaviors:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8202/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The dev container compiles the backend on boot (cargo run over a bind
      # mount); a cold CI build has no cargo cache, so allow a long warm-up.
      start_period: 600s

  organiclever-app-web:
    build:
      context: ../../..
      dockerfile: apps/organiclever-app-web/Dockerfile
      args:
        ORGANICLEVER_BE_URL: http://organiclever-be:8202
    ports:
      - "3202:3202"
    environment:
      ORGANICLEVER_BE_URL: "http://organiclever-be:8202"
    depends_on:
      organiclever-be:
        condition: service_healthy
