# Local development stack for roots-be, alone.
#
# The service owns no database, cache, or queue -- it answers a health endpoint
# and nothing else -- so this file has exactly one service. That absence is the
# same fact that makes roots-be's Integration test layer inapplicable: there
# is no local resource boundary to integrate against.
#
# Run from the repo root:
#   docker compose -f infra/dev/roots-be/docker-compose.yml up --build

services:
  roots-be:
    build:
      # The Dockerfile copies from apps/roots-be/, so the context must be the
      # repo root rather than this directory.
      context: ../../..
      dockerfile: apps/roots-be/Dockerfile
    image: roots-be:dev
    ports:
      - "8402:8402"
    environment:
      # Explicit rather than relying on the built-in default, so the compose
      # file documents the port it publishes.
      ROOTS_BE_PORT: "8402"
    restart: unless-stopped
