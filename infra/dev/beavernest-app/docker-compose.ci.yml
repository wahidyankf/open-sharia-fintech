services:
  beavernest-app:
    # The host-side SQLite verifier and this disposable container must use the
    # same identity. This CI-only override never ships in the production
    # compose stack, whose entrypoint continues to enforce UID 10001/mode 700.
    user: "${BEAVERNEST_BE_E2E_UID:-10001}:${BEAVERNEST_BE_E2E_GID:-10001}"
    entrypoint: []
    command: ["dotnet", "BeaverNestBe.dll"]
    build:
      context: ../../..
      dockerfile: apps/beavernest-be/Dockerfile
    environment:
      APP_ENV: "${APP_ENV:-local}"
      BEAVERNEST_BE_HTTP_LISTEN_ADDRESS: 0.0.0.0
      BEAVERNEST_BE_HTTP_LISTEN_PORT: "19300"
      BEAVERNEST_BE_SQLITE_BUSY_TIMEOUT_MILLISECONDS: "1000"
