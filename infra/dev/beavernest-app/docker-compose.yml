x-beavernest-app: &beavernest-app
  build:
    context: ../../..
    dockerfile: apps/beavernest-be/Dockerfile
  environment:
    APP_ENV: "${APP_ENV:-local}"
    BEAVERNEST_BE_DATA_DIRECTORY: /var/lib/beavernest
    BEAVERNEST_BE_HTTP_LISTEN_ADDRESS: 0.0.0.0
    BEAVERNEST_BE_HTTP_LISTEN_PORT: "19300"
    BEAVERNEST_BE_SQLITE_BUSY_TIMEOUT_MILLISECONDS: "1000"

services:
  beavernest-app:
    <<: *beavernest-app
    ports:
      - "${BEAVERNEST_BE_VPN_HOST_IP:-127.0.0.1}:${BEAVERNEST_BE_PUBLIC_PORT:-19300}:19300"
    volumes:
      - type: bind
        source: ${BEAVERNEST_BE_HOST_DATA_DIRECTORY:-/tmp/beavernest-unconfigured-data}
        target: /var/lib/beavernest
        bind:
          create_host_path: false
      - type: bind
        source: ${BEAVERNEST_BE_BACKUP_DIRECTORY:-/tmp/beavernest-unconfigured-backups}
        target: /var/backups/beavernest
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19300/api/v1/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  beavernest-backup:
    <<: *beavernest-app
    profiles: ["operations"]
    command: ["backup", "--name", "${BEAVERNEST_BE_OPERATION_NAME:-operation.sqlite3}"]
    environment:
      APP_ENV: "${APP_ENV:-local}"
      BEAVERNEST_BE_BACKUP_DIRECTORY: /var/backups/beavernest
      BEAVERNEST_BE_DATA_DIRECTORY: /var/lib/beavernest
      BEAVERNEST_BE_HTTP_LISTEN_ADDRESS: 0.0.0.0
      BEAVERNEST_BE_HTTP_LISTEN_PORT: "19300"
      BEAVERNEST_BE_SQLITE_BUSY_TIMEOUT_MILLISECONDS: "1000"
    volumes:
      - type: bind
        source: ${BEAVERNEST_BE_HOST_DATA_DIRECTORY:-/tmp/beavernest-unconfigured-data}
        target: /var/lib/beavernest
        bind:
          create_host_path: false
      - type: bind
        source: ${BEAVERNEST_BE_BACKUP_DIRECTORY:-/tmp/beavernest-unconfigured-backups}
        target: /var/backups/beavernest
        bind:
          create_host_path: false

  beavernest-integrity:
    <<: *beavernest-app
    profiles: ["operations"]
    command: ["integrity"]
    volumes:
      - type: bind
        source: ${BEAVERNEST_BE_HOST_DATA_DIRECTORY:-/tmp/beavernest-unconfigured-data}
        target: /var/lib/beavernest
        bind:
          create_host_path: false

  beavernest-restore:
    <<: *beavernest-app
    profiles: ["operations"]
    command: ["restore", "--name", "${BEAVERNEST_BE_OPERATION_NAME:-operation.sqlite3}"]
    environment:
      APP_ENV: "${APP_ENV:-local}"
      BEAVERNEST_BE_BACKUP_DIRECTORY: /var/backups/beavernest
      BEAVERNEST_BE_DATA_DIRECTORY: /var/lib/beavernest
      BEAVERNEST_BE_HTTP_LISTEN_ADDRESS: 0.0.0.0
      BEAVERNEST_BE_HTTP_LISTEN_PORT: "19300"
      BEAVERNEST_BE_SQLITE_BUSY_TIMEOUT_MILLISECONDS: "1000"
    volumes:
      - type: bind
        source: ${BEAVERNEST_BE_HOST_DATA_DIRECTORY:-/tmp/beavernest-unconfigured-data}
        target: /var/lib/beavernest
        bind:
          create_host_path: false
      - type: bind
        source: ${BEAVERNEST_BE_BACKUP_DIRECTORY:-/tmp/beavernest-unconfigured-backups}
        target: /var/backups/beavernest
        bind:
          create_host_path: false
