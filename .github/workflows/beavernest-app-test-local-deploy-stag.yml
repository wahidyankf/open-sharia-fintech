name: beavernest-app-test-local-deploy-stag

# Heavy-test pipeline for the combined BeaverNest image and same-origin E2E.
# No combined staging target is provisioned, so this workflow never deploys —
# it therefore does not call the shared `_reusable-app-test-local-deploy-stag.yml`
# (that reusable workflow's `deploy` job unconditionally force-pushes stag
# branches, which BeaverNest does not yet have). Jobs below mirror the reusable
# workflow's non-deploy stages, adapted for BeaverNest's single combined image
# (frontend + backend served same-origin from one container on port 19300).

on:
  pull_request:
    paths:
      - "apps/beavernest-app/**"
      - "apps/beavernest-app-e2e/**"
      - "apps/beavernest-be/**"
      - "infra/dev/beavernest-app/**"
      - "specs/apps/beavernest/**"
      - ".fvmrc"
      - "repo-config.yml"
  schedule:
    - cron: "0 20 * * *" # 3 AM WIB (UTC+7)
    - cron: "0 8 * * *" # 3 PM WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specs-coverage:
    name: Spec coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Run specs:behavior:coverage for the app group
        run: |
          npx nx run beavernest-be:specs:behavior:coverage
          npx nx run beavernest-app:specs:behavior:coverage

  fe-lint:
    name: FE lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - run: dart pub global activate fvm 4.0.5
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: npx nx run beavernest-app:lint

  be-integration:
    name: BE integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node

      - name: Run integration tests
        run: |
          docker compose -f apps/beavernest-be/docker-compose.integration.yml down -v 2>/dev/null || true
          docker compose -f apps/beavernest-be/docker-compose.integration.yml up --abort-on-container-exit --build

      - name: Teardown integration
        if: always()
        run: docker compose -f apps/beavernest-be/docker-compose.integration.yml down -v

  fe-widget:
    name: FE integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - run: dart pub global activate fvm 4.0.5
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Run integration tests
        run: npx nx run beavernest-app:test:unit

  e2e:
    name: E2E tests (BE + FE, same-origin combined runtime)
    needs: [be-integration, fe-widget]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-playwright
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - run: dart pub global activate fvm 4.0.5
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # Each *-e2e project's test:e2e target owns its own disposable combined
      # runtime (apps/beavernest-be/scripts/run-e2e.sh): build image, boot,
      # wait for readiness, run Playwright, tear down.
      - name: Run BE E2E tests
        run: npx nx run beavernest-be-e2e:test:e2e

      - name: Upload BE E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-beavernest-be
          path: apps/beavernest-be-e2e/playwright-report/
          retention-days: 7

      - name: Run FE E2E tests
        run: npx nx run beavernest-app-e2e:test:e2e

      - name: Upload FE E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-beavernest-app
          path: apps/beavernest-app-e2e/playwright-report/
          retention-days: 7

  infra-tests:
    name: Infra shell-test harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run infra/dev/beavernest-app/tests scripts
        run: |
          set -euo pipefail
          for script in infra/dev/beavernest-app/tests/*.sh; do
            case "$(basename "$script")" in
            # affected-propagation.sh asserts against a real base/head git
            # diff (`nx show projects --affected --base=origin/main
            # --head=HEAD`). On this workflow's schedule/workflow_dispatch
            # triggers, HEAD already equals origin/main post-merge, so the
            # diff is always empty and the assertion would permanently fail
            # rather than verify anything. This suite's `test-local` jobs
            # also never run in the PR gate (see
            # repo-governance/development/infra/github-actions-workflow-naming.md),
            # so there is no pull_request trigger to give it a real diff
            # either. Left unwired pending a fixture-driven rewrite that
            # manufactures its own diff instead of depending on ambient git
            # state.
            affected-propagation.sh) continue ;;
            # workflow-contract.sh asserts beavernest-be is wired into
            # publish-images.yml and into the *shared* reusable
            # `_reusable-app-test-local-deploy-stag.yml`. Neither is true by
            # design: BeaverNest has no k3s staging target yet (deploy
            # provisioning is explicitly deferred — see
            # specs/apps/beavernest/product/README.md), and this workflow
            # deliberately does not call the shared reusable workflow (see
            # this file's own header comment) because that reusable
            # workflow's `deploy` job unconditionally force-pushes stag
            # branches BeaverNest does not have. Left unwired pending
            # either the deferred deploy-provisioning plan or a rewrite of
            # this script for the standalone-workflow shape actually built.
            workflow-contract.sh) continue ;;
            esac
            echo "::group::$script"
            bash "$script"
            echo "::endgroup::"
          done

  specs-gate:
    name: Specs gate (BDD+DDD validators)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx run-many -t specs:structure-validation --projects=rhino-cli
