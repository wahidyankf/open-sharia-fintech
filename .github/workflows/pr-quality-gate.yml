name: pr-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
  NX_HEAD: ${{ github.sha }}
  GATE_CHANGED_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}

jobs:
  detect:
    name: Detect affected languages
    runs-on: ubuntu-latest
    outputs:
      has-ts: ${{ steps.detect.outputs.has-ts }}
      has-dotnet: ${{ steps.detect.outputs.has-dotnet }}
      has-rust: ${{ steps.detect.outputs.has-rust }}
      has-markdown: ${{ steps.detect.outputs.has-markdown }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        run: |
          AFFECTED=$(npx nx show projects --affected 2>/dev/null || echo "")
          # Check language tags for affected projects
          {
            echo "has-ts=false"
            echo "has-dotnet=false"
            echo "has-rust=false"
            echo "has-markdown=false"
          } >> "$GITHUB_OUTPUT"

          for project in $AFFECTED; do
            TAGS=$(npx nx show project "$project" --json 2>/dev/null | jq -r '.tags[]' 2>/dev/null || echo "")
            for tag in $TAGS; do
              case "$tag" in
                lang:ts) echo "has-ts=true" >> "$GITHUB_OUTPUT" ;;
                lang:fsharp|lang:csharp) echo "has-dotnet=true" >> "$GITHUB_OUTPUT" ;;
                lang:rust) echo "has-rust=true" >> "$GITHUB_OUTPUT" ;;
              esac
            done
          done

          # Check for markdown changes
          CHANGED_FILES=$(git diff --name-only "$NX_BASE"...HEAD 2>/dev/null || echo "")
          if echo "$CHANGED_FILES" | grep -q '\.md$'; then
            echo "has-markdown=true" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Auto-format affected (lint-staged)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - name: Provision registry-declared pre-commit tools
        run: |
          tools=$(cargo run --release --quiet --manifest-path apps/rhino-cli/Cargo.toml -- gate list --surface=pre-commit --format=json |
            jq -r '[.[] | .doctor_tools[]] | unique | join(",")')
          if [ -n "$tools" ]; then
            npm run doctor -- --fix --tools "$tools"
          fi
      - name: Format affected files with the project formatters (lint-staged)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF...HEAD")
          if [ -n "$CHANGED" ]; then
            printf '%s' "$CHANGED" | tr '\n' '\0' | xargs -0 -r git add --
            npx lint-staged --no-stash
          fi
      - name: Commit formatting to the PR branch
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: auto-format affected files (lint-staged)"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi

      - name: Verify affected formatting on main
        if: github.event_name == 'push'
        run: |
          cargo run --release --quiet --manifest-path apps/rhino-cli/Cargo.toml -- gate list --surface=ci --format=json |
            jq -r '.[] | select(.id | startswith("format-verify-")) | .id' |
            while IFS= read -r gate_id; do
              cargo run --release --quiet --manifest-path apps/rhino-cli/Cargo.toml -- gate run --surface=ci --only="$gate_id"
            done

  enumerate:
    name: Enumerate registry CI gates
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.list.outputs.gates }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - id: list
        run: |
          gates=$(cargo run --release --quiet --manifest-path apps/rhino-cli/Cargo.toml -- gate list --surface=ci --format=json | jq -c .)
          echo "gates=$gates" >> "$GITHUB_OUTPUT"

  gate:
    needs: enumerate
    name: ${{ matrix.gate.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJson(needs.enumerate.outputs.gates) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - name: Provision registry-declared tools
        run: |
          tools="$DOCTOR_TOOLS"
          if [ -n "$tools" ]; then
            npm run doctor -- --fix --tools "$tools"
          fi
        env:
          DOCTOR_TOOLS: ${{ join(matrix.gate.doctor_tools, ',') }}
      - run: >-
          cargo run --release --quiet --manifest-path apps/rhino-cli/Cargo.toml -- gate run
          --surface=ci --only="$GATE_ID"
        env:
          GATE_ID: ${{ matrix.gate.id }}

  typescript:
    name: TypeScript quality gate
    needs: detect
    if: needs.detect.outputs.has-ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      # --parallel=2 bounds peak memory when many TS projects are affected at once (e.g. a
      # shared-lib change).
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:fsharp,tag:lang:csharp,tag:lang:rust' --parallel=2

  dotnet:
    name: .NET quality gate
    needs: detect
    if: needs.detect.outputs.has-dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      # Both affected F# backends invoke OpenAPI Generator during codegen. It initializes a shared
      # downloaded JAR, so serial execution prevents a first-run download race.
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:ts,tag:lang:rust' --parallel=1

  rust:
    name: Rust quality gate
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp'

  compat-min-version:
    name: Minimum version compatibility (all affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx affected -t compat:min-version

  specs-structure:
    name: Specs structure validation (all affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx affected -t specs:structure-validation

  quality-gate:
    name: Quality gate
    needs: [format, enumerate, gate, typescript, dotnet, rust, compat-min-version, specs-structure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates
        run: |
          echo "Checking quality gate results..."
          # A skipped job is OK (language not affected). Only an actual failure blocks.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more quality gate jobs failed"
            exit 1
          fi
          echo "All quality gates passed"
