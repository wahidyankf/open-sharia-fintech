name: pr-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
  NX_HEAD: ${{ github.sha }}
  GATE_CHANGED_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}

jobs:
  detect:
    name: Detect affected languages
    runs-on: ubuntu-latest
    outputs:
      has-ts: ${{ steps.detect.outputs.has-ts }}
      has-dotnet: ${{ steps.detect.outputs.has-dotnet }}
      has-rust: ${{ steps.detect.outputs.has-rust }}
      has-markdown: ${{ steps.detect.outputs.has-markdown }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        run: |
          AFFECTED=$(npx nx show projects --affected 2>/dev/null || echo "")
          # Check language tags for affected projects
          {
            echo "has-ts=false"
            echo "has-dotnet=false"
            echo "has-rust=false"
            echo "has-markdown=false"
          } >> "$GITHUB_OUTPUT"

          for project in $AFFECTED; do
            TAGS=$(npx nx show project "$project" --json 2>/dev/null | jq -r '.tags[]' 2>/dev/null || echo "")
            for tag in $TAGS; do
              case "$tag" in
                lang:ts) echo "has-ts=true" >> "$GITHUB_OUTPUT" ;;
                lang:fsharp|lang:csharp) echo "has-dotnet=true" >> "$GITHUB_OUTPUT" ;;
                lang:rust) echo "has-rust=true" >> "$GITHUB_OUTPUT" ;;
              esac
            done
          done

          # Check for markdown changes
          CHANGED_FILES=$(git diff --name-only "$NX_BASE"...HEAD 2>/dev/null || echo "")
          if echo "$CHANGED_FILES" | grep -q '\.md$'; then
            echo "has-markdown=true" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Auto-format affected (lint-staged)
    needs: build-rhino
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Every rhino-bin.sh call in this job — including the ones inside
      # lint-staged's own `repo-config.yml`/`*.md`/`*.feature` commands —
      # resolves this prebuilt `--profile gate` artifact at tier 1 instead
      # of falling back to a from-source `cargo build`/`cargo run` compile.
      #
      # Provenance trade-off (accepted, not an oversight): `build-rhino`
      # checks out with no `ref:` override, so on `pull_request` events it
      # compiles this binary from GitHub's synthetic base+head merge commit,
      # while this job checks out head-only content (see `ref:` below).
      # Every rhino-bin.sh call in this job therefore applies merge-commit
      # gate logic to head-only content. All affected commands are
      # read-only validators — none rewrite files — so the worst outcome is
      # a wrong pass/fail verdict, never rhino-derived content written back
      # to the branch, and it self-corrects on rebase against a current
      # `main`. A second, head-sha-pinned artifact built solely for this job
      # was judged not worth the extra CI job for that bound; revisit if a
      # validator invoked here ever gains file-mutating behavior.
      RHINO_CLI_BIN: ${{ github.workspace }}/apps/rhino-cli/target/gate/rhino-cli
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      # format-verify-fantomas (surfaces=["ci"]) and lint-staged's own "*.fs"
      # handler both invoke the bare `fantomas` binary, which only this
      # composite action installs (dotnet SDK + global fantomas tool).
      # Unconditional: this job's own affected-file-type scoping (not the
      # `detect` job's push-delta-scoped has-dotnet) decides whether fantomas
      # actually runs, and the two scopes don't agree — gating this step on
      # `detect`'s output skipped the install on a push whose delta had no
      # .fs files even though the gate itself still tried to invoke fantomas
      # against the full diff.
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-gate-binary
          path: apps/rhino-cli/target/gate
      - run: chmod +x apps/rhino-cli/target/gate/rhino-cli
      - name: Provision registry-declared pre-commit tools
        run: |
          tools=$(apps/rhino-cli/scripts/rhino-bin.sh gate list --surface=pre-commit --format=json |
            jq -r '[.[] | .doctor_tools[]] | unique | join(",")')
          if [ -n "$tools" ]; then
            apps/rhino-cli/scripts/rhino-bin.sh doctor --fix --tools "$tools"
          fi
      - name: Format affected files with the project formatters (lint-staged)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF...HEAD")
          if [ -n "$CHANGED" ]; then
            printf '%s' "$CHANGED" | tr '\n' '\0' | xargs -0 -r git add --
            npx lint-staged --no-stash
          fi
      - name: Commit formatting to the PR branch
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: auto-format affected files (lint-staged)"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi

      - name: Verify affected formatting on main
        if: github.event_name == 'push'
        # Runs every formatting-verify gate as a single --group dispatch
        # instead of the pre-optimization one-at-a-time --only loop, mirroring
        # every other CI surface's group-based invocation.
        run: apps/rhino-cli/scripts/rhino-bin.sh gate run --surface=ci --group=formatting-verify

  build-rhino:
    name: Build rhino-cli (gate profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: cargo build --profile gate --manifest-path apps/rhino-cli/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-cli-gate-binary
          path: apps/rhino-cli/target/gate/rhino-cli

  enumerate:
    name: Enumerate registry CI gate groups
    needs: build-rhino
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
        with:
          # `enumerate` only lists gate groups via the shim; the `list` step
          # later in this job sets RHINO_CLI_BIN inline for that one
          # invocation so rhino-bin.sh resolves the artifact downloaded by
          # the `download-artifact` step (also later in this job) instead of
          # falling back to cargo/node. jq is runner-provided; no npm-managed
          # tool is needed here.
          run-npm-ci: false
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-gate-binary
          path: apps/rhino-cli/target/gate
      - run: chmod +x apps/rhino-cli/target/gate/rhino-cli
      - id: list
        run: |
          groups=$(RHINO_CLI_BIN="$PWD/apps/rhino-cli/target/gate/rhino-cli" apps/rhino-cli/scripts/rhino-bin.sh gate list --surface=ci --format=json --by-group | jq -c .)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  gate:
    needs: [build-rhino, enumerate]
    name: ${{ matrix.group.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.enumerate.outputs.groups) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          run-npm-ci: ${{ contains(matrix.group.doctor_tools, 'npm') }}
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-gate-binary
          path: apps/rhino-cli/target/gate
      - run: chmod +x apps/rhino-cli/target/gate/rhino-cli
      - name: Provision registry-declared tools
        run: |
          tools="$DOCTOR_TOOLS"
          if [ -n "$tools" ]; then
            apps/rhino-cli/scripts/rhino-bin.sh doctor --fix --tools "$tools"
          fi
        env:
          DOCTOR_TOOLS: ${{ join(matrix.group.doctor_tools, ',') }}
          RHINO_CLI_BIN: ${{ github.workspace }}/apps/rhino-cli/target/gate/rhino-cli
      - run: apps/rhino-cli/scripts/rhino-bin.sh gate run --surface=ci --group="$GROUP_ID"
        env:
          RHINO_CLI_BIN: ${{ github.workspace }}/apps/rhino-cli/target/gate/rhino-cli
          GROUP_ID: ${{ matrix.group.group }}

  typescript:
    name: TypeScript quality gate
    needs: detect
    if: needs.detect.outputs.has-ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      # --parallel=2 bounds peak memory when many TS projects are affected at once (e.g. a
      # shared-lib change).
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:fsharp,tag:lang:csharp,tag:lang:rust' --parallel=2

  dotnet:
    name: .NET quality gate
    needs: detect
    if: needs.detect.outputs.has-dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      # Both affected F# backends invoke OpenAPI Generator during codegen. It initializes a shared
      # downloaded JAR, so serial execution prevents a first-run download race.
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:ts,tag:lang:rust' --parallel=1

  rust:
    name: Rust quality gate
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp'
      # Coverage was lifted out of the local `test:quick` chain (DD-7) so pre-push stays fast. It
      # still gates merge — `--fail-under-lines 90` lives in the target itself, so a coverage drop
      # turns this job red exactly as it previously turned pre-push red.
      - run: npx nx affected -t test:coverage --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp'

  compat-min-version:
    name: Minimum version compatibility (all affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx affected -t compat:min-version

  specs-structure:
    name: Specs structure validation (all affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx affected -t specs:structure-validation

  quality-gate:
    name: Quality gate
    needs: [build-rhino, format, enumerate, gate, typescript, dotnet, rust, compat-min-version, specs-structure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates
        run: |
          echo "Checking quality gate results..."
          # A skipped job is OK (language not affected). Only an actual failure blocks.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more quality gate jobs failed"
            exit 1
          fi
          echo "All quality gates passed"
