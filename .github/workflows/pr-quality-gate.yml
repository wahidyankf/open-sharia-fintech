name: pr-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
  NX_HEAD: ${{ github.sha }}
  GATE_CHANGED_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}

jobs:
  detect:
    name: Detect affected languages
    runs-on: ubuntu-latest
    outputs:
      has-ts: ${{ steps.detect.outputs.has-ts }}
      has-dotnet-projects: ${{ steps.detect.outputs.has-dotnet-projects }}
      has-rust: ${{ steps.detect.outputs.has-rust }}
      has-dart: ${{ steps.detect.outputs.has-dart }}
      has-markdown: ${{ steps.detect.outputs.has-markdown }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        run: |
          # has-dotnet-projects (like has-ts / has-rust) answers "which nx
          # projects does the affected-graph mark as touched", via each
          # project's `lang:*` tag — the same question the merge-blocking
          # `dotnet` job's own `nx affected` invocation answers. That is a
          # DIFFERENT question from "did a file literally change": a
          # project.json/global.json/*.sln/repo-config.yml edit marks an
          # F#/C# project affected via nx's default namedInputs without
          # touching a .fs/.cs file, so a file-glob predicate here would be
          # narrower than what the `dotnet` job's own targets need and could
          # silently skip that merge-blocking gate. The `format` job needs a
          # much cheaper, narrower signal (just "should we install the
          # dotnet SDK for fantomas") and now computes that itself locally
          # via a file-glob check — see that job's own `dotnet-files` step —
          # rather than depending on this job's affected-graph precision.
          DETECT_FAILED=false

          # A real git-diff error (bad ref, corrupted repo, etc.) is NOT the
          # same outcome as "no files changed" — swallowing it into an empty
          # CHANGED_FILES would silently disable has-markdown detection.
          # Fail safe below instead of fail open.
          if ! CHANGED_FILES=$(git diff --name-only "$NX_BASE"...HEAD); then
            echo "::warning::git diff --name-only $NX_BASE...HEAD failed (a real error, not simply \"no changes\") — failing safe below instead of silently disabling quality gates" >&2
            CHANGED_FILES=""
            DETECT_FAILED=true
          fi

          if ! AFFECTED=$(npx nx show projects --affected); then
            echo "::warning::nx show projects --affected failed — failing safe below instead of silently disabling quality gates" >&2
            AFFECTED=""
            DETECT_FAILED=true
          fi

          if [ "$DETECT_FAILED" = "true" ]; then
            # Conservative fallback (fail closed, not open): when detection
            # itself errors, run every language's quality gate rather than
            # silently skip a merge-blocking check. Deliberately does NOT
            # fail this job outright — a hard `detect` failure would make
            # `typescript`/`dotnet`/`rust` report "skipped" (failed
            # dependency), not "failure", which `quality-gate`'s
            # `contains(needs.*.result, 'failure')` check would not catch.
            {
              echo "has-ts=true"
              echo "has-dotnet-projects=true"
              echo "has-rust=true"
              echo "has-dart=true"
              echo "has-markdown=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check language tags for affected projects
          {
            echo "has-ts=false"
            echo "has-dotnet-projects=false"
            echo "has-rust=false"
            echo "has-dart=false"
            echo "has-markdown=false"
          } >> "$GITHUB_OUTPUT"

          for project in $AFFECTED; do
            TAGS=$(npx nx show project "$project" --json 2>/dev/null | jq -r '.tags[]' 2>/dev/null || echo "")
            for tag in $TAGS; do
              case "$tag" in
                lang:ts) echo "has-ts=true" >> "$GITHUB_OUTPUT" ;;
                lang:fsharp | lang:csharp) echo "has-dotnet-projects=true" >> "$GITHUB_OUTPUT" ;;
                lang:rust) echo "has-rust=true" >> "$GITHUB_OUTPUT" ;;
                lang:dart) echo "has-dart=true" >> "$GITHUB_OUTPUT" ;;
              esac
            done
          done

          if echo "$CHANGED_FILES" | grep -q '\.md$'; then
            echo "has-markdown=true" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Auto-format affected (lint-staged)
    needs: build-rhino
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Every rhino-bin.sh call in this job — including the ones inside
      # lint-staged's own `repo-config.yml`/`*.md`/`*.feature` commands —
      # resolves this prebuilt `--profile gate` artifact at tier 1 instead
      # of falling back to a from-source `cargo build`/`cargo run` compile.
      #
      # Provenance trade-off (accepted, not an oversight): `build-rhino`
      # checks out with no `ref:` override, so on `pull_request` events it
      # compiles this binary from GitHub's synthetic base+head merge commit,
      # while this job checks out head-only content (see `ref:` below).
      # Every rhino-bin.sh call in this job therefore applies merge-commit
      # gate logic to head-only content. All affected commands are
      # read-only validators — none rewrite files — so the worst outcome is
      # a wrong pass/fail verdict, never rhino-derived content written back
      # to the branch, and it self-corrects on rebase against a current
      # `main`. A second, head-sha-pinned artifact built solely for this job
      # was judged not worth the extra CI job for that bound; revisit if a
      # validator invoked here ever gains file-mutating behavior.
      RHINO_CLI_BIN: ${{ github.workspace }}/apps/rhino-cli/target/gate/rhino-cli
      # Mirrors RHINO_CLI_BIN above for the F# binary this job's rhino-bin.sh
      # calls resolve to once a namespace is listed in FSHARP_NAMESPACES.
      RHINO_CLI_FSHARP_BIN: ${{ github.workspace }}/apps/rhino-cli/src-fsharp/dist/rhino-cli-fsharp
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      # lint-staged invokes the bare `dart format` command for changed Dart
      # files, so the formatter must be available before it runs.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      # format-verify-fantomas (surfaces=["ci"]) and lint-staged's own "*.fs"
      # handler both invoke the bare `fantomas` binary, which only the
      # setup-dotnet composite action installs (dotnet SDK + global fantomas
      # tool). This job only needs a cheap "did a .fs/.fsi/.fsx/.fsproj/.cs/
      # .csproj file literally change" signal to decide whether to pay that
      # SDK-install cost — a narrower, cheaper question than the `detect`
      # job's affected-PROJECT-graph precision (which the merge-blocking
      # `dotnet` job needs instead — see `detect`'s has-dotnet-projects
      # comment for why those are different questions). Computing it locally
      # here removes the `needs: detect` edge this job previously carried
      # purely to read that narrower signal, which had re-serialized
      # `format` behind `detect` on every run even though `format`'s only
      # other prerequisite (`build-rhino`) already runs in parallel with
      # `detect`.
      - name: Detect dotnet file changes (fast local check for SDK install)
        id: dotnet-files
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF" 2>/dev/null || true
          fi
          if ! CHANGED_FILES=$(git diff --name-only "$NX_BASE"...HEAD); then
            echo "::warning::git diff --name-only $NX_BASE...HEAD failed — failing safe by installing the dotnet SDK anyway" >&2
            echo "has-dotnet-files=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$CHANGED_FILES" | grep -qE '\.(fs|fsi|fsx|fsproj|cs|csproj)$'; then
            echo "has-dotnet-files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-dotnet-files=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-dotnet
        if: steps.dotnet-files.outputs.has-dotnet-files == 'true'
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-gate-binary
          path: apps/rhino-cli/target/gate
      - run: chmod +x apps/rhino-cli/target/gate/rhino-cli
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-fsharp-binary
          path: apps/rhino-cli/src-fsharp/dist
      - run: chmod +x apps/rhino-cli/src-fsharp/dist/rhino-cli-fsharp
      - name: Provision registry-declared pre-commit tools
        run: |
          tools=$(apps/rhino-cli/scripts/rhino-bin.sh gate list --surface=pre-commit --format=json |
            jq -r '[.[] | .doctor_tools[]] | unique | join(",")')
          if [ -n "$tools" ]; then
            apps/rhino-cli/scripts/rhino-bin.sh doctor --fix --tools "$tools"
          fi
      - name: Format affected files with the project formatters (lint-staged)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF...HEAD")
          if [ -n "$CHANGED" ]; then
            printf '%s' "$CHANGED" | tr '\n' '\0' | xargs -0 -r git add -f --
            npx lint-staged --no-stash
          fi
      - name: Commit formatting to the PR branch
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: auto-format affected files (lint-staged)"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi

      - name: Verify affected formatting on main
        if: github.event_name == 'push'
        # Runs every formatting-verify gate as a single --group dispatch
        # instead of the pre-optimization one-at-a-time --only loop, mirroring
        # every other CI surface's group-based invocation.
        run: apps/rhino-cli/scripts/rhino-bin.sh gate run --surface=ci --group=formatting-verify

  build-rhino:
    name: Build rhino-cli (gate profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: cargo build --profile gate --manifest-path apps/rhino-cli/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-cli-gate-binary
          path: apps/rhino-cli/target/gate/rhino-cli
      # F# rhino-cli port (rewrite-rhino-cli-to-fsharp): publishes alongside
      # the Rust binary from Phase 2 onward so every downstream job can
      # resolve either binary through the dispatch shim. Self-contained,
      # non-AOT per the Phase 1 publish-mode decision
      # (learnings.md#publish-mode-decision) — bundles the .NET runtime so
      # the eight consumer jobs below stay toolchain-free, unlike a
      # framework-dependent publish. Invokes the Nx `build` target itself
      # (never a hand-written `dotnet publish` duplicate) so there is exactly
      # one source of truth for the publish command; `--rid` overrides the
      # target's `--use-current-runtime` default with the pinned RID judgment
      # call recorded in
      # learnings.md#2026-08-26--phase-2-publish-rid-pinned-to-linux-x64-judgment-call.
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - run: npx nx run rhino-cli-fsharp:build --rid="-r linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-cli-fsharp-binary
          path: apps/rhino-cli/src-fsharp/dist

  enumerate:
    name: Enumerate registry CI gate groups
    needs: build-rhino
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
        with:
          # `enumerate` only lists gate groups via the shim; the `list` step
          # later in this job sets RHINO_CLI_BIN inline for that one
          # invocation so rhino-bin.sh resolves the artifact downloaded by
          # the `download-artifact` step (also later in this job) instead of
          # falling back to cargo/node. jq is runner-provided; no npm-managed
          # tool is needed here.
          run-npm-ci: false
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-gate-binary
          path: apps/rhino-cli/target/gate
      - run: chmod +x apps/rhino-cli/target/gate/rhino-cli
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-fsharp-binary
          path: apps/rhino-cli/src-fsharp/dist
      - run: chmod +x apps/rhino-cli/src-fsharp/dist/rhino-cli-fsharp
      - id: list
        run: |
          groups=$(RHINO_CLI_BIN="$PWD/apps/rhino-cli/target/gate/rhino-cli" RHINO_CLI_FSHARP_BIN="$PWD/apps/rhino-cli/src-fsharp/dist/rhino-cli-fsharp" apps/rhino-cli/scripts/rhino-bin.sh gate list --surface=ci --format=json --by-group | jq -c .)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  gate:
    needs: [build-rhino, enumerate]
    name: ${{ matrix.group.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.enumerate.outputs.groups) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          run-npm-ci: ${{ contains(matrix.group.doctor_tools, 'npm') }}
      # format-verify-fantomas (ci-group: formatting-verify) invokes the bare
      # `fantomas` binary, which only this composite action installs (dotnet
      # SDK + global fantomas tool). Its repo-config.yml gate entry declares
      # no `doctor_tools` (fantomas isn't in the doctor tool inventory —
      # see application/doctor/tools.rs), so the generic "Provision
      # registry-declared tools" step below never installs it. Scoped to
      # this one group rather than every matrix member to avoid paying the
      # dotnet-SDK-install cost on unrelated CI groups.
      - uses: ./.github/actions/setup-dotnet
        if: matrix.group.group == 'formatting-verify'
      # format-verify-dart invokes bare `dart format`, and runs only in this
      # group alongside the similarly scoped Fantomas setup above.
      - uses: subosito/flutter-action@v2
        if: matrix.group.group == 'formatting-verify'
        with:
          channel: stable
          flutter-version-file: .fvmrc
      # format-verify-ruff invokes a bare binary for changed Python files. Ruff
      # is not yet a rhino doctor-managed tool, so this scoped install keeps the
      # formatting group provisioned without adding Python setup to other jobs.
      - name: Install Ruff
        if: matrix.group.group == 'formatting-verify'
        run: pipx install ruff==0.15.9
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-gate-binary
          path: apps/rhino-cli/target/gate
      - run: chmod +x apps/rhino-cli/target/gate/rhino-cli
      - uses: actions/download-artifact@v4
        with:
          name: rhino-cli-fsharp-binary
          path: apps/rhino-cli/src-fsharp/dist
      - run: chmod +x apps/rhino-cli/src-fsharp/dist/rhino-cli-fsharp
      - name: Provision registry-declared tools
        run: |
          tools="$DOCTOR_TOOLS"
          if [ -n "$tools" ]; then
            apps/rhino-cli/scripts/rhino-bin.sh doctor --fix --tools "$tools"
          fi
        env:
          DOCTOR_TOOLS: ${{ join(matrix.group.doctor_tools, ',') }}
          RHINO_CLI_BIN: ${{ github.workspace }}/apps/rhino-cli/target/gate/rhino-cli
          RHINO_CLI_FSHARP_BIN: ${{ github.workspace }}/apps/rhino-cli/src-fsharp/dist/rhino-cli-fsharp
      - run: apps/rhino-cli/scripts/rhino-bin.sh gate run --surface=ci --group="$GROUP_ID"
        env:
          RHINO_CLI_BIN: ${{ github.workspace }}/apps/rhino-cli/target/gate/rhino-cli
          RHINO_CLI_FSHARP_BIN: ${{ github.workspace }}/apps/rhino-cli/src-fsharp/dist/rhino-cli-fsharp
          GROUP_ID: ${{ matrix.group.group }}

  typescript:
    name: TypeScript quality gate
    needs: detect
    if: needs.detect.outputs.has-ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      # --parallel=2 bounds peak memory when many TS projects are affected at once (e.g. a
      # shared-lib change).
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:fsharp,tag:lang:csharp,tag:lang:rust,tag:lang:dart' --parallel=2

  dotnet:
    name: .NET quality gate
    needs: detect
    if: needs.detect.outputs.has-dotnet-projects == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      # typecheck's `dotnet build --no-restore` requires a prior project-level restore —
      # the NuGet package cache above only warms `~/.nuget/packages`, it does not generate
      # each project's `obj/project.assets.json`. Every dotnet-tagged project's `install`
      # target runs `dotnet restore`, so run it explicitly before typecheck.
      - run: npx nx affected -t install --exclude='tag:lang:ts,tag:lang:rust,tag:lang:dart' --parallel=1
      # Both affected F# backends invoke OpenAPI Generator during codegen. It initializes a shared
      # downloaded JAR, so serial execution prevents a first-run download race.
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:ts,tag:lang:rust,tag:lang:dart' --parallel=1
      # test:coverage carries each project's own coverage threshold (e.g. rhino-cli-fsharp's
      # coverlet `/p:Threshold=90 /p:ThresholdType=line`). Without this step the threshold is
      # declared but never enforced by CI — mirrors the rust job's identical split below.
      - run: npx nx affected -t test:coverage --exclude='tag:lang:ts,tag:lang:rust,tag:lang:dart' --parallel=1

  rust:
    name: Rust quality gate
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-latest
    # `rhino-cli`'s Elixir formatter-wrapper tests
    # (`tests/gate_format_verify_wrappers.rs`) assert real `mix format`
    # behavior when the toolchain is present and otherwise skip quietly —
    # except in an environment that sets `RHINO_REQUIRE_ELIXIR`, which this
    # job does. Provisioning the toolchain here, unconditionally, is what
    # turns that assertion from a dormant opt-in into real coverage that runs
    # on every CI invocation instead of never running anywhere.
    env:
      RHINO_REQUIRE_ELIXIR: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # Rust targets share Cargo's registry and build locks. Keep the target families serial so
      # the nested test:quick gate cannot contend with standalone checks on CI runners.
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp,tag:lang:dart' --parallel=1 --outputStyle=stream
      # Coverage was lifted out of the local `test:quick` chain (DD-7) so pre-push stays fast. It
      # still gates merge — `--fail-under-lines 90` lives in the target itself, so a coverage drop
      # turns this job red exactly as it previously turned pre-push red.
      - run: npx nx affected -t test:coverage --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp,tag:lang:dart' --parallel=1 --outputStyle=stream

  flutter:
    name: Flutter quality gate
    needs: detect
    if: needs.detect.outputs.has-dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      # The action provides the bare `dart` binary. FVM then installs and
      # selects the Flutter SDK pinned by the repository's .fvmrc.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      - name: Install Flutter Version Management
        run: |
          dart pub global activate fvm 4.0.5
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install the repository Flutter SDK
        run: fvm install
      - run: npx nx affected -t typecheck lint test:quick specs:behavior:coverage --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp,tag:lang:rust' --parallel=1

  compat-min-version:
    name: Minimum version compatibility (all affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx affected -t compat:min-version

  specs-structure:
    name: Specs structure validation (all affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx affected -t specs:structure-validation

  quality-gate:
    name: Quality gate
    needs:
      [build-rhino, format, enumerate, gate, typescript, dotnet, rust, flutter, compat-min-version, specs-structure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates
        run: |
          echo "Checking quality gate results..."
          # A skipped job is OK (language not affected). Only an actual failure blocks.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more quality gate jobs failed"
            exit 1
          fi
          echo "All quality gates passed"
