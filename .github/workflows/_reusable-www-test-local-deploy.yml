name: _reusable-www-test-local-deploy

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      prod-branch:
        required: true
        type: string
      health-url:
        required: false
        type: string
        default: ""
      health-timeout:
        required: false
        type: number
        default: 120
      copy-prerender-manifest-for-e2e:
        required: false
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npx nx run ${{ inputs.app-name }}:lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npx nx run ${{ inputs.app-name }}:test:quick

  specs-coverage:
    name: Spec coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Run specs:behavior:coverage for app and E2E runners
        run: |
          npx nx run ${{ inputs.app-name }}:specs:behavior:coverage
          # Run E2E runner specs:behavior:coverage if the target exists on the project
          for suffix in be-e2e fe-e2e; do
            proj="${{ inputs.app-name }}-${suffix}"
            if npx nx show project "$proj" --json 2>/dev/null | grep -q '"specs:behavior:coverage"'; then
              npx nx run "${proj}:specs:behavior:coverage"
            fi
          done

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npx nx run ${{ inputs.app-name }}:test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-docker-cache
      - uses: ./.github/actions/setup-playwright
      # Start via Docker
      - run: docker compose -f infra/dev/${{ inputs.app-name }}/docker-compose.yml up --build -d
      # Wait for health
      - run: |
          HEALTH_URL="${{ inputs.health-url }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="http://localhost:3100"
          fi
          for _ in $(seq 1 $(( ${{ inputs.health-timeout }} / 5 ))); do
            if curl -s "$HEALTH_URL" > /dev/null 2>&1; then break; fi
            sleep 5
          done
      - name: Copy prerender manifest for E2E
        if: inputs.copy-prerender-manifest-for-e2e
        run: |
          artifact_dir="apps/${{ inputs.app-name }}-fe-e2e/.e2e-artifacts"
          container_id="$(docker compose -f infra/dev/${{ inputs.app-name }}/docker-compose.yml ps -q "${{ inputs.app-name }}")"
          test -n "$container_id"
          mkdir -p "$artifact_dir"
          docker cp "$container_id:/app/apps/${{ inputs.app-name }}/.next/prerender-manifest.json" "$artifact_dir/prerender-manifest.json"
      # Run E2E
      - run: |
          npx nx run ${{ inputs.app-name }}-be-e2e:test:e2e || true
          npx nx run ${{ inputs.app-name }}-fe-e2e:test:e2e
      - if: always()
        run: docker compose -f infra/dev/${{ inputs.app-name }}/docker-compose.yml down -v

  specs-gate:
    name: Specs gate (BDD+DDD validators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - run: npx nx run-many -t specs:structure-validation --projects=rhino-cli

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- "apps/${{ inputs.app-name }}/" 2>/dev/null || echo "")
          if [ -n "$CHANGED" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to production
    needs: [lint, unit, integration, e2e, detect-changes, specs-gate]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git push origin HEAD:${{ inputs.prod-branch }} --force
