name: Rhino CLI Parity Audit

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Compare against canonical manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download the canonical Rhino CLI manifest
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/wahidyankf/ose-public/main/apps/rhino-cli/parity-manifest.sha256 \
            -o "$RUNNER_TEMP/canonical-parity-manifest.sha256"
      - name: Report Rhino CLI parity drift
        run: |
          if ! diff -u "$RUNNER_TEMP/canonical-parity-manifest.sha256" apps/rhino-cli/parity-manifest.sha256; then
            echo "Rhino CLI parity drift: apps/rhino-cli/parity-manifest.sha256 differs from ose-public main." >&2
            exit 1
          fi
