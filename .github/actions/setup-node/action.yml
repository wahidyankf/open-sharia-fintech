name: "Setup Node.js"
description: "Install Node.js via Volta, run npm ci, and configure Nx cache"
inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  run-npm-ci:
    description: "Whether to restore the npm cache and run npm ci. Set false for jobs whose gates resolve no node-managed tool."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Install Node.js via Volta
      uses: volta-cli/action@v5

    - name: Cache npm dependencies
      if: inputs.run-npm-ci == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Restore npm dependencies
      if: inputs.run-npm-ci == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v5
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.run-npm-ci == 'true'
      shell: bash
      run: npm ci

    - name: Configure Nx cache
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@v5
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ hashFiles('nx.json', 'package-lock.json') }}
        # Only the broadest OS-level fallback is a meaningful restore-keys
        # prefix here: the exact `key` above has no dynamic suffix (DD-8), so
        # a middle tier reproducing that same key plus a trailing "-" can
        # never prefix-match anything actually saved under this scheme.
        restore-keys: |
          nx-${{ runner.os }}-

    - name: Restore Nx cache
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v5
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ hashFiles('nx.json', 'package-lock.json') }}
        restore-keys: |
          nx-${{ runner.os }}-
