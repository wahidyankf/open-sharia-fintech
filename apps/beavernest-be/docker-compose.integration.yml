# No backing services (Postgres, NATS, etc.) — beavernest-be's integration test
# (HostBootTests.fs) boots the Kestrel host in-process and calls it over real HTTP,
# with no external dependencies to wire up here.
services:
  test-runner:
    build:
      context: ../..
      dockerfile: apps/beavernest-be/Dockerfile.integration
    environment:
      BEAVERNEST_BE_DATA_DIRECTORY: "/tmp/beavernest-integration"
      BEAVERNEST_BE_HTTP_LISTEN_ADDRESS: "127.0.0.1"
      BEAVERNEST_BE_HTTP_LISTEN_PORT: "19320"
      BEAVERNEST_BE_SQLITE_BUSY_TIMEOUT_MILLISECONDS: "1000"
    tmpfs:
      - /tmp/beavernest-integration:mode=0700
