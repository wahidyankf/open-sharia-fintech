# oapi-codegen configuration for roots-be.
#
# Deliberately NOT inside generated-contracts/: the root .gitignore ignores
# **/generated-contracts/, so a config file there would be untracked and a fresh
# clone could not run codegen at all. This file is authored input, not output.
#
# Only the Gin server interface and the model types are generated. No client is
# emitted: nothing in this repository calls roots-be from Go, and an unused
# generated client is dead code the coverage floor would then have to excuse.
package: generatedcontracts
output: generated-contracts/api.gen.go
generate:
  gin-server: true
  models: true
  embedded-spec: false
output-options:
  skip-prune: true
