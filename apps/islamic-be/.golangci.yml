# golangci-lint 2.x config schema. The `version` key is mandatory in v2 and a 1.x
# binary cannot read this file, which is why repo-config.yml pins >=2.11 and CI
# installs through the Go module proxy rather than apt.
version: "2"

linters:
  # `standard` is errcheck, govet, ineffassign, staticcheck, unused -- exactly the
  # five the plan requires. Named explicitly rather than relying on the default so
  # the set is reviewable here instead of in golangci-lint's release notes.
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
