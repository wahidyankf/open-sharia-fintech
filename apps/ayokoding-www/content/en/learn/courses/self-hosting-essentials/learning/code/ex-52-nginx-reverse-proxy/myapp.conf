# Example 52: An Nginx Reverse-Proxy Config. (co-09)
#
# The Nginx equivalent of Examples 12+14: terminate HTTPS, redirect HTTP, and
# reverse_proxy to the app on 127.0.0.1:8000. Unlike Caddy, Nginx does NOT
# obtain the cert for you -- you provision it (here via certbot, separately).
# Save as /etc/nginx/sites-available/myapp, symlink into sites-enabled, then:
# nginx -t && systemctl reload nginx.

# --- 1. Redirect plain HTTP -> HTTPS (the co-10 upgrade Caddy does implicitly) -
server {
    listen 80;                              # => co-09: listen on the public HTTP port
    server_name myapp.example.com;          # => only this host (others get the default server)
    return 301 https://$host$request_uri;   # => permanent redirect to HTTPS (Example 53 in full)
}

# --- 2. The HTTPS server: TLS + reverse_proxy --------------------------------
server {
    listen 443 ssl;                         # => co-09/co-10: listen on the public TLS port
    server_name myapp.example.com;

    ssl_certificate     /etc/letsencrypt/live/myapp.example.com/fullchain.pem;  # => the cert (from certbot)
    ssl_certificate_key /etc/letsencrypt/live/myapp.example.com/privkey.pem;    # => its private key

    location / {
        proxy_pass http://127.0.0.1:8000;          # => co-09: forward to the app's local port
        proxy_set_header Host $host;               # => preserve the original Host header
        proxy_set_header X-Forwarded-For $remote_addr;  # => the caller's real IP (not nginx's)
        proxy_set_header X-Forwarded-Proto https;  # => tell the app the upstream was HTTPS
    }
}

# --- Verify ------------------------------------------------------------------
#   nginx -t                          # => 'syntax is ok, test is successful'
#   curl -sI https://myapp.example.com/health   # => HTTP/2 200
# [verify] Nginx terminates TLS and forwards, parity with the Caddy build (co-09).