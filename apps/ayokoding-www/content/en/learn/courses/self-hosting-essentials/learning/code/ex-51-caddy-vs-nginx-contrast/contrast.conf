# Example 51: The Same Proxy Rule in Caddy and Nginx. (co-09)
#
# Side-by-side: the SAME reverse-proxy rule ("forward myapp.example.com to
# 127.0.0.1:8000") in Caddy's and Nginx's syntax. The CONCEPT is identical
# (co-09); only the dialect differs. This file shows both so you can see what
# each tool is actually doing underneath the vocabulary.

# =============================================================================
# Caddy (Caddyfile) -- the version used in Examples 12-14
# =============================================================================
myapp.example.com {  # => co-09: the public host
  reverse_proxy 127.0.0.1:8000  # => forward to the app's local port (one line, TLS auto)
}  # => automatic HTTPS, redirect, and renewal are implicit in Caddy

# =============================================================================
# Nginx (nginx.conf / sites-enabled/myapp) -- the version Example 52 expands
# =============================================================================
# server {                                    # => co-09: the public host block
#     server_name myapp.example.com;          # => match requests for this host (SNI/Host)
#     location / {                            # => every path under this host
#         proxy_pass http://127.0.0.1:8000;   # => forward to the app's local port
#     }                                       # => Nginx does NOT auto-do TLS; see Example 52
# }
# --- The takeaway (co-09) ----------------------------------------------------
# Both tools terminate public traffic and forward to a local port. Caddy hides
# TLS, the redirect, and the upstream headers; Nginx makes each one explicit.
# Pick by whether you want "it just works" (Caddy) or "every knob is mine" (Nginx).
# [verify] either dialect, deployed, makes the app reachable at https://myapp.example.com.