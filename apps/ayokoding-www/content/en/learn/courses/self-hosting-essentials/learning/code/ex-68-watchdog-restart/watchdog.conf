# Example 68: A systemd Watchdog for Hung Services. (co-15, co-07)
#
# Restart=always (Example 10) revives a CRASHED process (exit). But a process
# can also HANG without exiting -- stuck in a deadlock, still "running" but not
# answering. The systemd WATCHDOG fixes this: the service must ping systemd
# ("I am alive") every WatchdogSec, or systemd FORCE-restarts it. Save as a
# drop-in: /etc/systemd/system/myapp.service.d/watchdog.conf. The app must call
# sd_notify("WATCHDOG=1") periodically (e.g. via the sdnotify Python package).

[Service]
WatchdogSec=30s  # => co-15: the app must report in every 30s, or it is presumed hung
Restart=always  # => a watchdog timeout counts as a failure -> restart (Example 10's Restart)
RestartSec=3

# --- The two failure modes this covers (co-15) -------------------------------
#   - CRASH (exit):      caught by Restart=always (Example 10) -- the process is GONE.
#   - HANG (no exit):    caught by the WATCHDOG -- the process is ALIVE but stuck.
# Without the watchdog, a hung service stays "active (running)" forever while
# serving nothing -- the worst kind of silent outage.
# --- The app's obligation (co-07) --------------------------------------------
# The service MUST send sd_notify("WATCHDOG=1") more often than WatchdogSec
# (systemd tells the app the expected interval via $WATCHDOG_USEC). A web
# service typically pings from a background thread after each successful request.
# --- Verify ------------------------------------------------------------------
#   systemctl daemon-reload && systemctl restart myapp
#   systemctl show myapp -p WatchdogUSec -p WatchdogLast  # => 30s; and a recent ping timestamp
#   # make the app STOP pinging (e.g. deadlock it) -> within 30s systemd force-restarts it
#   journalctl -u myapp -n 5 | grep -i watchdog  # => a 'watchdog timeout' + restart line (co-15 proof)