# Example 49: A systemd Drop-In Override. (co-07)
#
# Editing a package-supplied unit file directly is fragile: the next package
# update overwrites it. A DROP-IN is a snippet that ADDS to or OVERRIDES a unit
# without touching the original -- the safe way to customize a service. This
# drop-in widens Example 10's restart policy for myapp. Save as:
#   /etc/systemd/system/myapp.service.d/restart.conf
# then: systemctl daemon-reload && systemctl restart myapp

[Service]  # => only the keys you want to change; everything else is inherited
# This drop-in overrides ONLY Restart/RestartSec from the original unit.
Restart=always  # => co-07/co-15: restart on any exit (widens 'on-failure' to 'always')
RestartSec=5  # => 5s between death and revival (slower than the original 3s -> gentler loop)
StartLimitIntervalSec=300  # => over a 5min window ...
StartLimitBurst=10  # => ... allow 10 restarts (more headroom than Example 10's 5/60s)
# The original Description, ExecStart, User, etc. are UNCHANGED -- the drop-in
# touches only what it names, which is exactly why it survives a package update.

# --- The mechanism -----------------------------------------------------------
# systemd MERGES every /etc/systemd/system/<unit>.d/*.conf into the unit, with
# drop-in keys taking precedence. 'systemctl cat myapp' shows the merged result.
# --- Verify ------------------------------------------------------------------
#   systemctl daemon-reload && systemctl restart myapp
#   systemctl cat myapp | grep -E '^Restart=|^RestartSec='  # => the drop-in's values win
#   systemctl show myapp -p Restart -p RestartSec           # => 'always' / '5s'
# [verify] the override took effect WITHOUT editing the original unit file (co-07).