# Example 69: A Restart Backoff Strategy. (co-15)
#
# RestartSec=3 (Example 10) waits a FIXED 3s between revivals. But if the
# service crashes BECAUSE of a transient problem (a busy dependency, a full
# disk), a fixed 3s loop hammers the same broken state. A BACKOFF grows the
# wait each restart, up to a cap -- giving the underlying problem time to clear.
# systemd's StartLimitIntervalSec caps the total; this drop-in tunes the wait.
# Save as /etc/systemd/system/myapp.service.d/backoff.conf.

[Service]
# Fixed 3s (Example 10) -> a gentle constant 5s here, AND a per-restart cap below.
RestartSec=5  # => co-15: base wait between restarts (gentler than Example 10's 3s)

# systemd does NOT grow RestartSec on its own; to get a true backoff you either
# set a slightly larger RestartSec (as here) or layer a small wrapper. The real
# backoff safety comes from the StartLimit knobs, which STOP an infinite loop:
StartLimitIntervalSec=120  # => over a 2-minute window ...
StartLimitBurst=8  # => ... allow at most 8 restarts; a 9th trips into 'failed'
# After StartLimitBurst is exceeded, systemd leaves the unit 'failed' (does not
# keep looping) -- which is the property that turns a tight crash loop into a
# loud, visible failure instead of a quiet resource burn.

# --- Why a cap matters (co-15) -----------------------------------------------
# A service that can never start (broken config, missing dep) MUST eventually
# STOP retrying -- otherwise it loops forever, burning CPU and filling the log.
# StartLimitBurst is the escape hatch: after N tries, give up and alert.
# --- Verify ------------------------------------------------------------------
#   systemctl daemon-reload && systemctl restart myapp
#   systemctl show myapp -p RestartSec -p StartLimitBurst  # => 5s ; 8
#   # force 9 quick failures (e.g. point ExecStart at a missing file):
#   systemctl status myapp  # => 'failed (Result: start-limit)' after the 9th (co-15 proof)