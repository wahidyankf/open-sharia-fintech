# Example 50: Graceful Shutdown with TimeoutStopSec. (co-08)
#
# When systemd stops a service, it sends SIGTERM, waits, then SIGKILL. The
# default wait (90s) is often too long; a too-short one kills in-flight work.
# TimeoutStopSec tunes this so the service finishes active requests before it
# dies -- the co-08 lifecycle detail that keeps a stop from dropping requests.
# Save as a drop-in: /etc/systemd/system/myapp.service.d/graceful.conf

[Service]
TimeoutStopSec=15s  # => co-08: give the app 15s to finish in-flight work after SIGTERM
KillSignal=SIGTERM  # => the initial signal (the app should trap this and drain)
FinalKillSignal=SIGKILL  # => the forceful fallback if it ignores SIGTERM past the timeout
SendSIGKILL=yes  # => confirm systemd WILL escalate to SIGKILL (no zombie services)

# --- The two-sided discipline (co-08) ----------------------------------------
# systemd's side: send SIGTERM, wait TimeoutStopSec, then SIGKILL.
# The APP's side: trap SIGTERM, stop accepting NEW requests, finish the IN-FLIGHT
# ones, then exit. Caddy/gunicorn/uvicorn all do this; a naive app that ignores
# SIGTERM gets killed mid-request at the 15s mark.
# --- Verify ------------------------------------------------------------------
#   time systemctl stop myapp    # => shows how long the actual stop took
#   # with a long request in flight, the stop waits up to 15s for it to finish
#   journalctl -u myapp -n 5     # => a clean 'Stopped' line (not a SIGKILL)
# [verify] in-flight requests finish before the process exits (co-08 proof).