# => Complete GitHub Actions workflow; copy into .github/workflows in a disposable repository.
name: "Example 52: Nx affected CI"
on:
  workflow_dispatch:
    inputs:
      base:
        description: Base branch used to calculate the affected graph.
        required: false
        default: main
jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # => This pinned Node action makes npm ci and Nx use the declared runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
          cache: npm
      # => Install the lockfile-resolved graph before asking Nx for affected projects.
      - run: npm ci
      # => Explicitly fetch the dispatch-selected base, even when checkout only has HEAD locally.
      - name: Fetch selected base
        env:
          BASE_REF: ${{ inputs.base }}
        run: git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --depth=1
      # => Nx derives the minimum impacted graph from the fetched base and dispatch SHA.
      - name: Run affected tests
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ github.sha }}
        run: npx nx affected -t test --base="origin/$BASE_REF" --head="$HEAD_REF"
