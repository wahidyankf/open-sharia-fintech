# Prerequisites: install Flagger, a compatible ingress provider, and Prometheus metrics.
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: course-service
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: course-service
  service:
    port: 8080
  analysis:
    interval: 1m
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        interval: 1m
        thresholdRange:
          min: 99
        templateRef:
          name: course-success-rate
      - name: request-duration
        interval: 1m
        thresholdRange:
          max: 500
        templateRef:
          name: course-request-duration
