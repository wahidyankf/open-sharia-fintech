# => This complete workflow belongs only to Example 60; it has no real credential.
# => Copy the artifact into .github/workflows/ when exercising it in a disposable repository.
name: "Example 60: Roll Back a Bad Canary Automatically"
# => Manual dispatch avoids unexpected production side effects during study.
on:
  workflow_dispatch:
# => The job provides repeatable hosted-runner evidence for co-24, co-26.
jobs:
  verify:
    # => Hosted Ubuntu keeps the example independent of a self-hosted machine.
    runs-on: ubuntu-latest
    steps:
      # => The immutable SHA pins the reviewed checkout action implementation.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # => The immutable SHA pins the Python setup action implementation.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          # => The course artifacts use the stated, supported Python version.
          python-version: "3.13"
      # => The working directory scopes execution to this one dedicated artifact.
      - name: Run canary-auto-rollback
        working-directory: apps/ayokoding-www/content/en/learn/courses/cicd-and-release-engineering/learning/code/ex-60-canary-auto-rollback
        run: python automation.py
