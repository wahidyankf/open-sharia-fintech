# => Complete GitHub Actions workflow; copy into .github/workflows in a disposable repository.
name: "Example 41: npm publish dry run"
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # => Dry-run validates package contents without contacting a registry.
      - run: npm publish --dry-run
