# => Complete GitHub Actions workflow; copy into .github/workflows in a disposable repository.
name: "Example 44: Pyright gate"
on:
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      # => A type error makes this job fail before any deploy job can depend on it.
      - run: npx pyright automation.py
