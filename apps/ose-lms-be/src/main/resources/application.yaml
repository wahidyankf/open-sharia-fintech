# The port is bound once, here. PortResolver.DEFAULT_PORT and
# PortResolver.PORT_ENVIRONMENT_VARIABLE hold the same two values for the Java side, and
# port-resolution.feature asserts that both spellings agree.
server:
  port: ${OSE_LMS_BE_PORT:8303}

# Actuator exposes health and nothing else, and health reports liveness without
# leaking component detail. Exposure is declared here, never inherited.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
