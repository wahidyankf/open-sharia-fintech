# repo-config.yml — schema: rhino-cli/repo-config/v1
#
# Unified repository configuration. Structure is byte-identical across both
# parity repos (ose-public, ose-private); values reflect each repo's actual
# project set and surfaces. rhino-cli commands read their relevant section.
#
# Sections defined here:
#   harness          — all-harness binding registry (§3.2); EVERY `harness` command reads this list
#   coverage         — per-project test-level registry (specs:behavior:coverage)
#   specs            — spec-tree structure config (specs:structure-validation)
#   governance-word-budget — per-surface instruction-file word budgets (rhino-cli governance word-budget validate)
#   env-contract     — surface registry for rhino-cli env validate (code↔config drift detection)
#   env-injection    — value-less injection manifest for rhino-cli env validate (manifest-consistency)
#   gates            — declared quality-gate registry; every `gate` command (list/run/emit/validate) reads this list

harness:
  # Authoritative harness registry — all 3 supported coding-agent harnesses.
  # Fields per entry:
  #   name        — harness identifier
  #   tier        — source | generated
  #   agent-dir   — directory of per-agent files (naming/duplication checks)
  #   skills-dir  — directory of skill files
  #   agent-name  — generated default-agent name (where the harness has one)
  #   mirrors     — source agent-dir this entry must mirror (generated tier)
  #   skills-mirrors — source skills-dir that skills-dir must mirror (generated tier)
  #   vendored    — directories inside the mirrored trees the emitter must never touch
  #   config      — config file path
  #   instruction — instruction surfaces this harness reads (word budget, per governance-word-budget:)
  #   ownership   — one declared class (generated | vendored | source) per binding path
  #
  # Adding a 4th harness = one entry here; every harness command picks it up automatically.
  - name: claude-code
    tier: source
    agent-dir: .claude/agents
    skills-dir: .claude/skills
    # Declared so the hand-authored config is visible to the cross-harness config-parity
    # obligation (Multi-Harness Binding Rule 10). Previously only codex declared a `config:`,
    # so two of the three configs the rule governs had no machine-readable record.
    config: .claude/settings.json
    instruction:
      - CLAUDE.md
    # Cells are transcribed verbatim from the hand-maintained table this
    # generation replaces, so the first generated output is byte-identical and
    # any later diff is a deliberate content change rather than emitter noise.
    catalog:
      platform: Claude Code
      reads-agents-md: "No — reads `CLAUDE.md` (shim `@AGENTS.md`)"
      instruction-surface: "`CLAUDE.md`, `.claude/`"
      mcp-config: "`.mcp.json`"
      agent-surface: "`.claude/agents/*.md`"
      skills-surface: "`.claude/skills/*/SKILL.md`"
      status: Active
    # Every path below carries exactly one of generated | vendored | source.
    # There is no fourth class and no unclassified residue: a tracked binding
    # file matching no declaration fails `harness ownership validate`.
    ownership:
      - { path: .claude/, class: source, reason: hand-authored tree every mirror is generated from }
      - { path: .claude/agents, class: source, reason: canonical agent definitions }
      - { path: .claude/skills, class: source, reason: canonical skill definitions }
      - { path: .claude/settings.json, class: source, reason: hand-authored permissions and hook registration }
      - { path: CLAUDE.md, class: source, reason: hand-authored Claude Code instruction surface }
  - name: opencode
    tier: generated
    agent-dir: .opencode/agents
    mirrors: .claude/agents
    config: .opencode/opencode.json
    instruction:
      - AGENTS.md
    catalog:
      platform: OpenCode
      reads-agents-md: "Yes"
      instruction-surface: "`.opencode/agents/` (auto-synced); reads `.claude/skills/` natively"
      mcp-config: "`opencode.json`"
      agent-surface: "`.opencode/agents/*.md`"
      skills-surface: "reads `.claude/skills/` **and** `.agents/skills/`"
      status: Active
    ownership:
      - { path: .opencode/agents, class: generated, reason: emitted from .claude/agents }
      - { path: .opencode/opencode.json, class: vendored, reason: OpenCode tooling config; no in-repo source }
      - { path: AGENTS.md, class: source, reason: hand-authored vendor-neutral instruction surface }
  - name: codex
    tier: generated
    agent-dir: .codex/agents
    mirrors: .claude/agents
    config: .codex/config.toml
    skills-dir: .agents/skills
    skills-mirrors: .claude/skills
    # Third-party plugin payload committed to the repository. None has a
    # .claude/skills/ counterpart, so the mirror emitter would have nothing to
    # regenerate them from — it must leave every one byte-identical (DD-7).
    # Origin below is each skill's own declared trigger, not an inference.
    vendored:
      - .agents/skills/cavecrew # cavecrew plugin — investigator/builder/reviewer subagent presets
      - .agents/skills/caveman # caveman plugin — /caveman mode toggle
      - .agents/skills/caveman-commit # caveman plugin — /caveman-commit
      - .agents/skills/caveman-compress # caveman plugin — /caveman:compress, the full payload
      - .agents/skills/caveman-help # caveman plugin — /caveman-help
      - .agents/skills/caveman-review # caveman plugin — /caveman-review
      - .agents/skills/caveman-stats # caveman plugin — /caveman-stats, /caveman-mode-tracker
      - .agents/skills/compress # caveman plugin — legacy unnamespaced alias of caveman-compress
    instruction:
      - AGENTS.md
      - RTK.md
    catalog:
      platform: OpenAI Codex CLI
      reads-agents-md: "Yes (since Apr 2025)"
      instruction-surface: "`AGENTS.md`, `RTK.md`, `AGENTS.override.md` (overrides), `.codex/config.toml`[^trust]"
      mcp-config: "`.codex/config.toml` `[mcp_servers]`[^mcp]"
      agent-surface: "`.codex/agents/<name>.toml` standalone files **and** `[agents.<name>]` tables in `config.toml`[^agents]"
      skills-surface: "`.agents/skills/`[^skills]"
      status: "Partial (`.codex/` exists)"
    ownership:
      - { path: .codex/agents, class: generated, reason: emitted from .claude/agents }
      - { path: .agents/skills, class: generated, reason: mirrored from .claude/skills }
      - { path: .codex/config.toml, class: vendored, reason: Nx tooling config; emitter owns the delimited region only }
      - { path: .codex/ci-monitor-subagent.toml, class: vendored, reason: Nx tooling file config.toml points at }
      - { path: AGENTS.md, class: source, reason: hand-authored vendor-neutral instruction surface }
      - { path: RTK.md, class: source, reason: upstream Codex RTK instruction surface }
      - { path: .agents/skills/cavecrew, class: vendored, reason: third-party plugin skill; no in-repo source }
      - { path: .agents/skills/caveman, class: vendored, reason: third-party plugin skill; no in-repo source }
      - { path: .agents/skills/caveman-commit, class: vendored, reason: third-party plugin skill; no in-repo source }
      - { path: .agents/skills/caveman-compress, class: vendored, reason: third-party plugin skill; no in-repo source }
      - { path: .agents/skills/caveman-help, class: vendored, reason: third-party plugin skill; no in-repo source }
      - { path: .agents/skills/caveman-review, class: vendored, reason: third-party plugin skill; no in-repo source }
      - { path: .agents/skills/caveman-stats, class: vendored, reason: third-party plugin skill; no in-repo source }
      - { path: .agents/skills/compress, class: vendored, reason: third-party plugin skill; no in-repo source }

harness-catalog:
  # Where the generated catalog region lands, and the date its upstream claims
  # were last verified by hand. Declared rather than stamped at generation time:
  # a generated timestamp would change on every run and make the drift guard
  # fire on its own output.
  document: docs/reference/platform-bindings.md
  verified: 2026-08-26

doctor:
  # Repository-relative .NET SDK version source. The shared Rust source reads
  # this data rather than naming an application-specific backend path.
  dotnet-global-json: apps/ose-be/global.json

coverage:
  # Explicit per-project test-level registry. One entry per Nx project (apps,
  # libs, *-e2e). No convention-derived defaults — every project is listed.
  # A scenario's level envelope P = union of `levels` across ALL entries whose
  # `specs` glob matches that scenario's feature file.
  # `levels` = the test levels this project runs at.
  # `specs`  = the feature-file glob this project owns (surface-precise for apps;
  #             per-project for libs).
  projects:
    # rhino-cli (tooling): single entry since Phase 9c retired the Rust crate
    # and merged the transition-era `rhino-cli-fsharp` Nx project back into
    # this one — the directory-by-directory widening this registry tracked
    # through Waves A-F no longer applies now that F# is the only
    # implementation and the whole spec surface is covered uniformly.
    - name: rhino-cli
      levels: [unit, integration]
      specs: "specs/apps/rhino/cli/behaviors/**"

    # ose domain
    - name: ose-be
      levels: [unit, integration]
      specs: "specs/apps/ose/be/behaviors/**"
    - name: ose-be-e2e
      levels: [e2e]
      specs: "specs/apps/ose/be/behaviors/**"
    - name: ose-app-web
      levels: [unit]
      specs: "specs/apps/ose/app-web/behaviors/**"
    - name: ose-app-web-e2e
      levels: [e2e]
      specs: "specs/apps/ose/app-web/behaviors/**"
    - name: ose-www
      levels: [unit]
      specs: "specs/apps/ose/www/behaviors/**"
    - name: ose-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/ose/www/behaviors/**"
    - name: ose-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/ose/www/behaviors/**"

    # organiclever domain
    - name: organiclever-be
      levels: [unit, integration]
      specs: "specs/apps/organiclever/be/behaviors/**"
    - name: organiclever-be-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/be/behaviors/**"
    - name: organiclever-app-web
      levels: [unit]
      specs: "specs/apps/organiclever/app-web/behaviors/**"
    - name: organiclever-app-web-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/app-web/behaviors/**"
    - name: organiclever-www
      levels: [unit]
      specs: "specs/apps/organiclever/www/behaviors/**"
    - name: organiclever-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/www/behaviors/**"
    - name: organiclever-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/www/behaviors/**"

    # ayokoding domain
    - name: ayokoding-www
      levels: [unit]
      specs: "specs/apps/ayokoding/www/behaviors/**"
    - name: ayokoding-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/ayokoding/www/behaviors/**"
    - name: ayokoding-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/ayokoding/www/behaviors/**"

    # crane domain
    - name: crane-cli
      levels: [unit]
      specs: "specs/apps/crane/cli/behaviors/**"

    # libs
    - name: web-ui
      levels: [unit]
      specs: "specs/libs/web-ui/behaviors/**"
    - name: fsharp-crane-core
      levels: [unit]
      specs: "specs/libs/fsharp-crane-core/behaviors/**"

    # Deliberately excluded, not omitted-by-oversight (Phase 2 closeout, 2026-07-02):
    #   web-ui-token, organiclever-contracts, ose-contracts — every test-level target
    #   (test:unit/test:integration/test:e2e) is a documented no-op
    #   ("target not applicable for this project") for these 3 projects; their real
    #   quality gate is typecheck (web-ui-token) or lint/bundle — OpenAPI spectral
    #   linting (the 2 *-contracts projects) — not a Gherkin-driven test level this
    #   registry models. Adding a levels: [] or levels: [unit] entry here would
    #   misleadingly claim behavior-spec coverage that doesn't exist.

testing:
  # Canonical `ose-test-contract/v1` registry. The frozen `coverage.projects`
  # block above is the immutable comparison source until Phase 20 contracts it;
  # every row here is derived from that block plus the frozen Phase 0 closure
  # `registry-project-closure.tsv`. Rhino never rewrites this file.
  schema: ose-test-contract/v1
  coverage:
    minimum-line: 99
  compatibility:
    # One migration map per Nx project, including the five projects the frozen
    # legacy block deliberately omits. Removed together with `coverage.projects`.
    mappings:
      - project: ayokoding-www
        behavior-id: ayokoding-www:default
        state: identity
        legacy:
          present: true
          corpus: "specs/apps/ayokoding/www/behaviors/**"
          levels: [unit]
        canonical:
          owner: ayokoding-www
          corpus: "specs/apps/ayokoding/www/behaviors/**"
          runtimes:
            - level: e2e
              project: ayokoding-www-fe-e2e
            - level: integration
