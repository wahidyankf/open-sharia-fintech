# repo-config.yml — schema: rhino-cli/repo-config/v1
#
# Unified repository configuration. Structure is byte-identical across all three
# repos (ose-public, ose-primer, ose-private); values reflect each repo's actual
# project set and surfaces. rhino-cli commands read their relevant section.
#
# Sections defined here:
#   harness          — all-harness binding registry (§3.2); EVERY `harness` command reads this list
#   coverage         — per-project test-level registry (specs:behavior:coverage + specs:domain:coverage)
#   specs            — spec-tree structure config (specs:structure-validation)
#   instruction-size — per-surface instruction-file byte budgets (rhino-cli harness instruction-size validate)
#   env-contract     — surface registry for rhino-cli env validate (code↔config drift detection)
#   env-injection    — value-less injection manifest for rhino-cli env validate (manifest-consistency)

harness:
  # Authoritative harness registry — all 11 supported coding-agent harnesses.
  # Fields per entry:
  #   name        — harness identifier
  #   tier        — source | generated | source-config | native
  #   agent-dir   — directory of per-agent files (naming/duplication checks)
  #   skills-dir  — directory of skill files (source tier only)
  #   rules-dir   — directory of injected rules (generated tier only)
  #   mirrors     — source agent-dir this entry must mirror (generated tier)
  #   config      — config file path (source-config tier)
  #   forbid-dir  — directory that must NOT exist (source-config tier)
  #   shadow      — thin-pointer file to check for no-shadowing (native tier)
  #   instruction — instruction surfaces this harness reads (instruction-size budget)
  #
  # Adding a 12th harness = one entry here; every harness command picks it up automatically.
  - { name: claude-code, tier: source, agent-dir: .claude/agents, skills-dir: .claude/skills, instruction: [CLAUDE.md] }
  - { name: opencode, tier: generated, agent-dir: .opencode/agents, mirrors: .claude/agents }
  - name: amazonq
    tier: generated
    rules-dir: .amazonq/rules
    instruction:
      - .amazonq/rules/*.md
  - name: codex
    tier: source-config
    config: .codex/config.toml
    forbid-dir: .codex/agents
    instruction:
      - AGENTS.md
  - {
      name: copilot,
      tier: native,
      shadow: .github/copilot-instructions.md,
      instruction: [AGENTS.md, .github/copilot-instructions.md],
    }
  - name: cursor
    tier: generated
    agent-dir: .cursor/agents
    mirrors: .claude/agents
    shadow: .cursor/rules
    instruction: [AGENTS.md, .cursor/rules]
  - { name: windsurf, tier: native, shadow: .windsurf/rules, instruction: [AGENTS.md, .windsurf/rules] }
  - { name: junie, tier: native, shadow: .junie/guidelines.md, instruction: [AGENTS.md, .junie/guidelines.md] }
  - { name: antigravity, tier: native, shadow: GEMINI.md, instruction: [AGENTS.md, GEMINI.md] }
  - { name: pi, tier: native, instruction: [AGENTS.md, CLAUDE.md] }
  - { name: aider, tier: native, shadow: CONVENTIONS.md, instruction: [AGENTS.md, CONVENTIONS.md] }

coverage:
  # Explicit per-project test-level registry. One entry per Nx project (apps,
  # libs, *-e2e). No convention-derived defaults — every project is listed.
  # A scenario's level envelope P = union of `levels` across ALL entries whose
  # `specs` glob matches that scenario's feature file.
  # `levels` = the test levels this project runs at.
  # `specs`  = the feature-file glob this project owns (surface-precise for apps;
  #             per-project for libs).
  projects:
    # rhino-cli (tooling)
    - name: rhino-cli
      levels: [unit, integration]
      specs: "specs/apps/rhino/behavior/rhino-cli/**"

    # ose domain
    - name: ose-be
      levels: [unit, integration]
      specs: "specs/apps/ose/behavior/be/**"
    - name: ose-be-e2e
      levels: [e2e]
      specs: "specs/apps/ose/behavior/be/**"
    - name: ose-app-web
      levels: [unit]
      specs: "specs/apps/ose/behavior/app-web/**"
    - name: ose-app-web-e2e
      levels: [e2e]
      specs: "specs/apps/ose/behavior/app-web/**"
    - name: ose-www
      levels: [unit]
      specs: "specs/apps/ose/behavior/www/**"
    - name: ose-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/ose/behavior/www/**"
    - name: ose-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/ose/behavior/www/**"
    - name: ose-cli
      levels: [unit, integration]
      specs: "specs/apps/ose/behavior/cli/**"

    # organiclever domain
    - name: organiclever-be
      levels: [unit, integration]
      specs: "specs/apps/organiclever/behavior/be/**"
    - name: organiclever-be-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/behavior/be/**"
    - name: organiclever-app-web
      levels: [unit]
      specs: "specs/apps/organiclever/behavior/app-web/**"
    - name: organiclever-app-web-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/behavior/app-web/**"
    - name: organiclever-www
      levels: [unit]
      specs: "specs/apps/organiclever/behavior/www/**"
    - name: organiclever-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/behavior/www/**"
    - name: organiclever-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/behavior/www/**"

    # ayokoding domain
    - name: ayokoding-www
      levels: [unit]
      specs: "specs/apps/ayokoding/behavior/www/**"
    - name: ayokoding-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/ayokoding/behavior/www/**"
    - name: ayokoding-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/ayokoding/behavior/www/**"
    - name: ayokoding-cli
      levels: [unit, integration]
      specs: "specs/apps/ayokoding/behavior/cli/**"

    # wahidyankf domain
    - name: wahidyankf-www
      levels: [unit]
      specs: "specs/apps/wahidyankf/behavior/www/**"
    - name: wahidyankf-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/wahidyankf/behavior/www/**"

    # crane domain
    - name: crane-cli
      levels: [unit, integration]
      specs: "specs/apps/crane/behavior/cli/**"

    # libs
    - name: rust-commons
      levels: [unit]
      specs: "specs/libs/rust-commons/behavior/**"
    - name: web-ui
      levels: [unit]
      specs: "specs/libs/web-ui/behavior/**"
    - name: fsharp-crane-core
      levels: [unit]
      specs: "specs/libs/fsharp-crane-core/behavior/**"

    # Deliberately excluded, not omitted-by-oversight (Phase 2 closeout, 2026-07-02):
    #   web-ui-token, organiclever-contracts, ose-contracts — every test-level target
    #   (test:unit/test:integration/test:e2e) is a documented no-op
    #   ("target not applicable for this project") for these 3 projects; their real
    #   quality gate is typecheck (web-ui-token) or lint/bundle — OpenAPI spectral
    #   linting (the 2 *-contracts projects) — not a Gherkin-driven test level this
    #   registry models. Adding a levels: [] or levels: [unit] entry here would
    #   misleadingly claim behavior-spec coverage that doesn't exist.

specs:
  # Areas that must carry a ddd/ folder (bounded-context registry). Lifts the
  # hardcoded apps_with_ddd() allowlist into explicit config.
  # An area NOT listed must NOT carry ddd/ (unlisted area with ddd/ = error).
  ddd-areas:
    - organiclever
    - ose

  # Areas eligible for specs:domain:coverage (explicit allowlist; distinct from
  # ddd-areas). A project NOT listed is skipped even if it has domain/** features.
  # Today: the *-be backends that own domain-bounded-context feature files.
  domain-areas:
    - organiclever-be
    - ose-be

instruction-size:
  surfaces:
    - glob: "AGENTS.md"
      target: 24000
      warn: 27000
      fail: 30000
    - glob: "**/AGENTS.md"
      target: 24000
      warn: 27000
      fail: 30000
    - glob: "CLAUDE.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: ".amazonq/rules/*.md"
      target: 4000
      warn: 8000
      fail: 12000
    - glob: ".windsurf/rules/*.md"
      target: 6000
      warn: 9000
      fail: 12000
    - glob: ".cursor/rules/*.mdc"
      target: 4000
      warn: 8000
      fail: 12000
    - glob: ".junie/guidelines.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: ".github/copilot-instructions.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: "CONVENTIONS.md"
      target: 10000
      warn: 13000
      fail: 16000
  resolved_tree:
    root: "CLAUDE.md"
    target: 30000
    warn: 34000
    fail: 38000

env-contract:
  # Surface registry for rhino-cli env validate (code↔config drift detection).
  # Companion: env-injection: declares, per app, the injection HOME for each key
  # at every deploy stage (names only, never values).
  #
  # Each surface entry carries:
  #   root      — path relative to repo root
  #   kind      — "app" (active); "terraform"/"ansible" are forward-scaffold
  #   lang      — "rust" or "typescript" (app kind only)
  #   allowlist — keys exempt from drift detection (framework-injected, test-only, etc.)
  surfaces:
    - root: apps/organiclever-be
      kind: app
      lang: fsharp
      allowlist:
        # Forward-declared config not yet consumed by the Phase 1 F# shell
        # (wired in later phases); declared in .env.example ahead of use.
        - ORGANICLEVER_BE_PORT
        - ORGANICLEVER_BE_CORS_ORIGINS

    - root: apps/ose-be
      kind: app
      lang: fsharp
      allowlist:
        # Forward-declared config not yet consumed by the Phase 1 F# shell
        # (port/CORS + OpenRouter wired in later phases); declared ahead of use.
        - OSE_BE_PORT
        - OSE_BE_CORS_ORIGINS
        - OSE_BE_OPENROUTER_API_KEY
        - OSE_BE_OPENROUTER_MODEL
        - OSE_BE_OPENROUTER_BASE_URL

    - root: apps/ose-www
      kind: app
      lang: typescript
      allowlist:
        - PORT # framework-reserved Next.js dev-server port
        - HOSTNAME # framework-reserved Next.js dev-server hostname

    - root: apps/ayokoding-www
      kind: app
      lang: typescript
      allowlist:
        - PORT
        - HOSTNAME
        - NODE_ENV # Node-reserved; read by static client-data refresh test guard

    - root: apps/organiclever-www
      kind: app
      lang: typescript
      allowlist:
        - PORT # framework-reserved Next.js dev-server port
        - HOSTNAME # framework-reserved Next.js dev-server hostname

    - root: apps/organiclever-app-web
      kind: app
      lang: typescript
      allowlist:
        - PORT
        - HOSTNAME

    - root: apps/ose-app-web
      kind: app
      lang: typescript
      allowlist:
        - PORT
        - HOSTNAME

    - root: apps/wahidyankf-www
      kind: app
      lang: typescript
      allowlist:
        - PORT
        - HOSTNAME

env-injection:
  # Value-less injection contract (extends env-contract:).
  # Declares, per app, the injection HOME for its env keys at every deploy stage
  # it runs in — NAMES ONLY, never values.
  #
  # Injection homes:
  #   env-local         — gitignored apps/<app>/.env.local (developer machine)
  #   compose           — infra/dev/<stack> docker-compose env (local CI), placeholders only
  #   vercel-preview     — Vercel project env, Preview scope (stag-*-app-web branch)
  #   vercel-production  — Vercel project env, Production scope (prod-*-www / prod-*-app-web)
  #   k3s-coralpolyp     — ose-private coralpolyp secret store (backend k3s rollout)
  apps:
    # --- www tier (direct-to-prod; e2e runs on local compose) ---
    - app: ose-www
      keys-from: apps/ose-www/.env.example
      runtime: { local: env-local, local-ci: compose, production: vercel-production }
    - app: ayokoding-www
      keys-from: apps/ayokoding-www/.env.example
      runtime: { local: env-local, local-ci: compose, production: vercel-production }
    - app: organiclever-www
      keys-from: apps/organiclever-www/.env.example
      runtime: { local: env-local, local-ci: compose, production: vercel-production }
    - app: wahidyankf-www
      keys-from: apps/wahidyankf-www/.env.example
      runtime: { local: env-local, local-ci: compose, production: vercel-production }

    # --- app-web tier (gated staging promotion) ---
    - app: organiclever-app-web
      keys-from: apps/organiclever-app-web/.env.example
      runtime: { local: env-local, local-ci: compose, staging: vercel-preview, production: vercel-production }
    - app: ose-app-web
      keys-from: apps/ose-app-web/.env.example
      runtime: { local: env-local, local-ci: compose, staging: vercel-preview, production: vercel-production }

    # --- backend tier (non-Vercel; k3s via ose-private coralpolyp) ---
    - app: organiclever-be
      keys-from: apps/organiclever-be/.env.example
      runtime: { local-ci: compose, staging: k3s-coralpolyp }
    - app: ose-be
      keys-from: apps/ose-be/.env.example
      runtime: { local-ci: compose, staging: k3s-coralpolyp }

  # CI test-harness keys — test-only, NEVER in any apps/<app>/.env.example.
  ci-harness:
    - key: API_BASE_URL
      class: var
      environments: [organiclever-app-staging, ose-app-staging]
    - key: WEB_BASE_URL
      class: var
      environments: [organiclever-app-staging, ose-app-staging]
    - key: VERCEL_AUTOMATION_BYPASS_SECRET
      class: secret
      environments: [organiclever-app-staging, ose-app-staging]
    - key: PLAYWRIGHT_GREP_INVERT
      class: literal
      environments: []
