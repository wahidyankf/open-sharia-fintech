[agents.pr-review-architecture-maker]
description = "Execution-grade PR reviewer scoped to the architecture discipline only — new tradeoffs, module boundaries, reversibility, blast radius, quality-attribute effects, and novel dependencies. One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-architecture-maker.toml"

[agents.pr-review-docs-maker]
description = "Execution-grade PR reviewer scoped to the documentation-quality discipline only — substantive README/docs/Diátaxis fit, doc drift vs. code, clarity, and doc alt-text/accessibility. One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-docs-maker.toml"

[agents.pr-review-fixer]
description = "Resolves unresolved GitHub PR review threads posted by pr-review-synthesis-maker's single consolidated review. Enumerates every unresolved thread via the GitHub Reviews API, applies a 4-way triage (fix / reject-with-reason / defer-with-reason / clarify), pushes fixes to the PR branch, replies to every thread, and resolves only the threads it actually addressed. Use as the fixer half of the PR-Review Maker→Fixer Cycle workflow (`repo-governance/workflows/pr/pr-review-quality-gate.md`), never standalone."
config_file = "agents/pr-review-fixer.toml"

[agents.pr-review-governance-maker]
description = "Execution-grade PR reviewer scoped to the governance/rules-conformance discipline only — mechanical conformance to already-documented repo-governance/ conventions, naming/structure, ADRs, and spec-file presence. One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-governance-maker.toml"

[agents.pr-review-instruction-maker]
description = "Execution-grade PR reviewer scoped to the instruction-decay discipline only — a framework/build-tool/package-manager/env-var/CI change in the diff not reflected in AGENTS.md/CLAUDE.md/.claude/, and instruction bloat (generic filler, not file length). One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-instruction-maker.toml"

[agents.pr-review-integrity-maker]
description = "Execution-grade PR reviewer scoped to the CI-gaming/test-integrity discipline only — weakened/skipped/narrowed tests, coverage-gaming, and missing regression tests. One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-integrity-maker.toml"

[agents.pr-review-logic-maker]
description = "Execution-grade PR reviewer scoped to the business-logic/correctness discipline only — behavior vs. domain intent plus Gherkin acceptance-criteria conformance across edge/error cases. One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-logic-maker.toml"

[agents.pr-review-performance-maker]
description = "Execution-grade PR reviewer scoped to the performance discipline only — concrete or likely performance regressions, hot-path changes, algorithmic-complexity growth, and resource (memory/IO/alloc) concerns. One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-performance-maker.toml"

[agents.pr-review-scout-maker]
description = "Planning-grade PR-review pipeline stage 0 — the tenth pr-review-*-maker agent, running before every cycle's specialist fan-out. Owns risk-tier classification (trivial/lite/full), route-specific specialist selection, shared-context assembly, and probe-class selection. Never discovers or posts findings itself — its four outputs are the risk tier, route-selected specialist set, shared-context brief, and probe class handed to the fan-out and pr-review-synthesis-maker."
config_file = "agents/pr-review-scout-maker.toml"

[agents.pr-review-security-maker]
description = "Execution-grade PR reviewer scoped to the security discipline only — secrets in diffs, injection, untrusted-input handling, git-fixture isolation, and unsafe git/FS operations. One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-security-maker.toml"

[agents.pr-review-synthesis-maker]
description = "Planning-grade PR-review coordinator — the eleventh pr-review-*-maker agent and the mandatory synthesizer atop the nine sonnet-tier discipline specialists. Consumes the risk tier, specialist set, and shared PR/plan/full-diff context brief that pr-review-scout-maker assembles upstream each cycle (including the prior-cycle thread-resolution and human-dismissal read), then deduplicates, re-categorizes (owning the architecture-versus-correctness boundary), reasonableness-filters, and tool-verifies the specialists' raw findings before posting exactly ONE consolidated review via the GitHub Reviews API for pr-review-fixer to consume."
config_file = "agents/pr-review-synthesis-maker.toml"

[agents.pr-review-types-maker]
description = "Execution-grade PR reviewer scoped to the type-soundness discipline only — type-system soundness beyond what the compiler already enforces, across TypeScript, Rust, F#, and C#. Flags unsound type escapes (unjustified any/unknown, unexplained unsafe blocks, panic-prone unwrap/expect on fallible paths, null-forgiving-operator misuse, non-exhaustive match/switch), never a compile/build failure (already CI-gated) and never whether a well-typed function's behavior is correct (pr-review-logic-maker's charter). One of nine discipline-scoped specialists feeding the pr-review-synthesis-maker coordinator; inherits pr-review-maker's hard rules verbatim, scoped to its own charter and SUPPRESS block."
config_file = "agents/pr-review-types-maker.toml"

