[agents.api-exploratory-tester]
description = "Performs spec-aware, contract-aware session-based exploratory testing of a live API — REST or GraphQL — given an endpoint/base-URL and a testing goal, then files findings as a new backlog plan a developer can pick up and fix. Hunts edge cases and boundary conditions (payloads, status codes, error envelopes, auth, pagination, idempotency, GraphQL nullability/partial-errors/depth), not just the happy path. Compares live responses against the API contract and existing specs/** Gherkin, proposing scenarios for correct behaviours lacking coverage. Never drives a browser — for rendered UI use the web tester triad. Output destination selectable via output-mode — plan (default), delivery, or local-tmp."
config_file = "agents/api-exploratory-tester.toml"

[agents.apps-ayokoding-www-annotated-concept-checker]
description = "Validates Annotated-concept tutorial quality including worked-example/scenario count (45-60 standard mode, 20-30 no-code sub-mode), annotation density (1.0-2.25 per code/pseudocode block), worked-example structure, diagram accessibility, and ayokoding-web compliance. Use when reviewing Annotated-concept content."
config_file = "agents/apps-ayokoding-www-annotated-concept-checker.toml"

[agents.apps-ayokoding-www-annotated-concept-fixer]
description = "Applies validated fixes from apps-ayokoding-www-annotated-concept-checker audit reports. Re-validates Annotated-concept findings (both standard and no-code sub-mode) before applying changes. Use after reviewing checker output."
